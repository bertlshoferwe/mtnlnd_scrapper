name: Daily Document Scan

on:
  schedule:
    # GitHub Actions cron is UTC only, and — like Vercel Hobby — only
    # guarantees the job starts sometime within this hour, not to the exact
    # minute. Adjust for your timezone: 07:00 UTC is 1am Mountain Daylight
    # Time (MDT, UTC-6) / midnight Mountain Standard Time (MST, UTC-7).
    # Keep DISPLAY_SCHEDULE_UTC (Vercel env, or its default in api/index.py)
    # in sync so the dashboard shows the right time.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      division_id:
        description: "Division to scan (leave blank to scan every division — this is what the daily schedule does)"
        required: false
        default: ""

jobs:
  scan:
    runs-on: ubuntu-latest
    # Generous timeout — the browser crawler can spend minutes per site, and
    # a big PDF haul plus AI scans adds up. GitHub allows up to 6 h per job.
    timeout-minutes: 120

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LibreOffice (for real DOCX page numbers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Install Python dependencies
        run: pip install -r requirements-scan.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-scan.txt') }}

      - name: Install Chromium for the crawler
        run: python -m playwright install --with-deps chromium

      - name: Run scan
        run: python scraper.py "${{ github.event.inputs.division_id }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Pick your AI provider — set AI_PROVIDER to "anthropic" or
          # "gemini" as a repo/environment secret, or leave it unset and it
          # auto-picks whichever key below is present. Only add the secret
          # for the provider you're actually using; the other can stay unset.
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
