<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161B33">
<title>Bid board</title>
<style>
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --ink:#1B2140; --muted:#5A607C; --line:#D5DAE5; --line2:#BFC5D4;
  --accent:#222B57; --accent-ink:#FFFFFF; --col:#E7E9F0; --high:#B8362B; --med:#A8701A; --low:#2F7A47;
  --highbg:#FBE6E3; --medbg:#F7EBD3; --lowbg:#E3F1E6; --chip:#E9ECF3; --shadow:none;
  --c1:#3D4DA3; --c2:#2F8F7B; --c3:#B8761F; --c4:#A2447F; --c5:#7A809B; --c6:#6B57C7;
  --side-bg:#161B33; --side-ink:#DDE1F0; --side-mute:#8E96B8; --side-hi:rgba(255,255,255,.1);
  --head:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1022; --surface:#171C30; --ink:#E8EAF3; --muted:#A3A9C4; --line:#2B3152; --line2:#3B4268;
    --accent:#8E9AD6; --accent-ink:#10142B; --col:#20253D; --high:#F08A80; --med:#D2A24E; --low:#6FBF86;
    --highbg:#3A1D21; --medbg:#2C2517; --lowbg:#16291F; --chip:#232944; --shadow:none;
    --c1:#8E9AD6; --c2:#5CC4AE; --c3:#D9A257; --c4:#D98BBF; --c5:#9AA0BC; --c6:#A99AF0;
    --side-bg:#090C1A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0C1022; --surface:#171C30; --ink:#E8EAF3; --muted:#A3A9C4; --line:#2B3152; --line2:#3B4268;
    --accent:#8E9AD6; --accent-ink:#10142B; --col:#20253D; --high:#F08A80; --med:#D2A24E; --low:#6FBF86;
    --highbg:#3A1D21; --medbg:#2C2517; --lowbg:#16291F; --chip:#232944; --shadow:none;
    --c1:#8E9AD6; --c2:#5CC4AE; --c3:#D9A257; --c4:#D98BBF; --c5:#9AA0BC; --c6:#A99AF0;
    --side-bg:#090C1A; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* layout */
.app{display:flex;min-height:100vh}
.main{flex:1 1 auto;min-width:0}
.side{width:248px;flex:0 0 248px;background:var(--side-bg);color:var(--side-ink);padding:18px 12px 20px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;align-self:flex-start;overflow-y:auto}
.brand{font:700 20px var(--head);letter-spacing:-.01em;padding:4px 10px 14px}
.sl{font-size:12px;color:var(--side-mute);padding:6px 10px;font-weight:600}
.proj{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:8px;padding:8px 10px;color:inherit;text-align:left}
.proj:hover{background:var(--side-hi)}
.proj.on{background:var(--side-hi);box-shadow:inset 3px 0 0 #9DB0FF}
.proj.add{color:var(--side-mute);margin-top:4px}
.pi{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--surface);flex:0 0 auto}
.pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sfoot{margin-top:auto;padding-top:12px}
.me{padding:12px 10px 0}
.me label{color:var(--side-mute);margin:0 0 4px}
.me input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:8px 10px;color:var(--side-ink)}
.scrim{display:none}
@media (max-width:899px){
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:40;transform:translateX(-100%);padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));box-shadow:4px 0 24px rgba(0,0,0,.3)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,16,24,.5);z-index:35}
}
/* wide screens: the menu button shrinks the sidebar to an icon rail */
@media (min-width:900px){
  .app.side-hidden .side{width:64px;flex-basis:64px;padding-left:10px;padding-right:10px;overflow-x:hidden}
  .app.side-hidden .side .brand,.app.side-hidden .side .sl,.app.side-hidden .side .pn,.app.side-hidden .side .me{display:none}
  .app.side-hidden .side .proj{justify-content:center;padding:8px 0!important}
  .app.side-hidden .side .proj.add{font-size:0;padding:6px 0!important}
  .app.side-hidden .side .proj.add::before{content:"+";font-size:18px;line-height:1}
  .app.side-hidden .side #plist{display:flex;flex-direction:column;gap:4px}
}
@media (min-width:900px) and (prefers-reduced-motion:no-preference){.side{transition:width .18s,flex-basis .18s}}
@media (prefers-reduced-motion:no-preference){.side{transition:transform .2s}}

.top{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.top .crumb{flex:1;min-width:0}
.top small{display:block;font-size:12px;color:var(--muted)}
h1{font-family:var(--head);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;padding:0}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filters{padding:12px 16px 0;display:grid;gap:8px}
.filters input,.fsel select,.ctrl select,.ctrl input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.fsel{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.fsel select{flex:0 0 auto;max-width:180px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--high)}
.btn.small{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}

/* issue chips and icons */
.ti{width:18px;height:18px;border-radius:5px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:var(--surface);flex:0 0 auto}
.pr{font-weight:700;font-size:13px;letter-spacing:-1px}
.key{font-size:12px;color:var(--muted);font-weight:600}
.chip{font-size:12px;background:var(--chip);border-radius:6px;padding:1px 7px;color:var(--muted)}
.chip.over{background:var(--high);color:var(--surface)}
.echip{display:inline-block;max-width:100%;font-size:12px;border-radius:6px;padding:1px 8px;margin:0 0 6px;background:var(--chip);color:var(--ink);border-left:4px solid var(--ec,var(--c6));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;display:grid;place-items:center;flex:0 0 auto}
.who.none{background:var(--chip);color:var(--muted)}
.sbadge{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;white-space:nowrap}
.cat-todo{background:var(--chip);color:var(--muted)}
.cat-doing{background:var(--accent);color:var(--accent-ink)}
.cat-done{background:var(--low);color:var(--surface)}

/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding:12px 16px 28px;scroll-snap-type:x proximity;align-items:flex-start}
.col{flex:0 0 min(84vw,290px);background:var(--col);border-radius:12px;padding:10px;scroll-snap-align:start;min-height:140px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col h2{display:flex;justify-content:space-between;align-items:center;gap:6px;font:600 15px var(--head);margin:2px 4px 10px}
.col h2 .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font:500 12px var(--body);color:var(--muted);background:var(--chip);border-radius:99px;padding:1px 9px}
.cards{display:flex;flex-direction:column;gap:8px;min-height:24px}
.card{background:var(--surface);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow);cursor:grab}
.card.dragging{opacity:.4}
.ck{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.ck .pr{margin-left:auto}
.card .title{display:block;width:100%;text-align:left;background:none;border:0;padding:2px 0 8px;font-weight:500;font-size:15px}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta .who{margin-left:auto}
.mv{display:flex;gap:6px;margin-top:8px}
.mv button{flex:1;background:var(--chip);border:0;border-radius:6px;padding:5px 0;font-size:13px;color:var(--muted)}
.mv button:disabled{opacity:.35;cursor:default}
.add{width:100%;margin-top:8px;background:none;border:1px dashed var(--line);border-radius:8px;padding:8px;color:var(--muted)}
.empty{font-size:13px;color:var(--muted);padding:6px 4px}

/* list */
.tablewrap{margin:12px 16px 28px;overflow-x:auto;background:var(--surface);border-radius:12px;box-shadow:var(--shadow)}
table.list{border-collapse:collapse;width:100%;min-width:680px}
table.list th{text-align:left;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding:0}
table.list th button{background:none;border:0;padding:10px 12px;font-weight:600;color:inherit;width:100%;text-align:left}
.thc{display:flex;align-items:center}
.thc button{flex:1}
.grip{cursor:grab;color:var(--muted);padding:10px 0 10px 10px;font-size:12px;user-select:none;letter-spacing:-2px}
table.list th.th-over{box-shadow:inset 3px 0 0 var(--accent)}
.lbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 16px 0}
.lbar+.tablewrap,.lbar+.lbar+.tablewrap{margin-top:12px}
table.list td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
table.list tr:last-child td{border-bottom:0}
.kc{display:flex;align-items:center;gap:6px;white-space:nowrap}
.lt{background:none;border:0;padding:0;text-align:left;font-weight:500;font-size:14px}
table.list select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:13px}
td.over{color:var(--high);font-weight:600}

/* calendar */
.cal-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px}
.cal-head h2{font:700 20px var(--head);margin:0;flex:1 1 150px}
.cal{margin:0 16px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dow{font-size:12px;color:var(--muted);text-align:center;padding:6px 0;background:var(--col);font-weight:600}
.day{min-height:88px;padding:4px;background:var(--surface);cursor:pointer;min-width:0}
.day.out{background:var(--bg)}
.day.out .dn{color:var(--muted);opacity:.6}
.day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.dn{font-size:12px;font-weight:600;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.day.today .dn{background:var(--accent);color:var(--accent-ink)}
.cc{display:flex;align-items:center;gap:6px;width:calc(100% - 8px);height:24px;margin:4px 4px 0;text-align:left;font-size:13px;border:0;border-left:3px solid var(--pc,var(--c5));border-radius:4px;background:var(--chip);padding:0 6px 0 5px;min-width:0;cursor:pointer;color:var(--ink)}
.cc.over{background:color-mix(in srgb,var(--high) 16%,var(--surface))}
.cc .ci{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--surface);background:var(--tc);flex:0 0 auto}
.cc .ct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;font-weight:500}
.cc .cx{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.cc .od{display:block;color:var(--high)}
.cc.fin .ct{text-decoration:line-through;opacity:.55}
.more{display:block;background:none;border:0;font-size:13px;font-weight:500;color:var(--ink);margin:4px 0 0;padding:2px 8px;text-align:left}
.day{padding:0 0 6px;min-height:92px}
.day.out{background:var(--surface)}
.day.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.dow{background:var(--surface);color:var(--ink);font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:10px 0}
.dn{display:flex;justify-content:center;width:auto;height:auto;border-radius:0;background:none;padding:6px 0 2px;font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase}
.dn .dnn{min-width:22px;height:22px;padding:0 6px;border-radius:11px;display:grid;place-items:center}
.day.today .dn{background:none;color:var(--ink)}
.day.today .dnn{background:var(--accent);color:var(--accent-ink);font-weight:600}
.day.out .dn{opacity:.5}
.calscroll{margin:0 16px;overflow-x:auto}
.calscroll .cal{margin:0}
.calfoot{grid-column:1/-1;background:var(--surface);text-align:center;padding:12px;font-size:13px;color:var(--muted)}
.dwk{display:none}
.cal.week .day{min-height:220px}
.calwrap{display:block}
.unsch{margin:0 16px 28px}
.unrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);cursor:grab}
.unrow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:900px){
  .calwrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;align-items:start}
  .unsch{margin:12px 16px 0 0}
}
.dots{display:none;justify-content:center;align-items:center;gap:3px;flex-wrap:wrap;padding:2px 4px 0}
.dots i{width:7px;height:7px;border-radius:50%;display:block}
.dots i.fin{opacity:.35}
.dots b{font-size:10px;line-height:7px;color:var(--muted);font-weight:600}
@media (max-width:640px){
  .calscroll{margin:0 8px}
  .cal-head{padding:12px 12px 8px}
  .cal-head h2{flex:1 1 100%}
  .cal-head .seg{margin-left:auto}
  .cal:not(.week) .day{min-height:58px;padding:0 0 4px}
  .cal:not(.week) .cc,.cal:not(.week) .more{display:none}
  .cal:not(.week) .dots{display:flex}
  .cal:not(.week) .dow{padding:8px 0;font-size:11px;letter-spacing:.02em}
  .cal:not(.week) .dn .dnn{min-width:24px;padding:0 4px}
  .cal:not(.week) .day.sel{outline:0}
  .cal:not(.week) .day.sel .dnn{box-shadow:0 0 0 2px var(--accent)}
  .calfoot{display:none}
  .cal.week{grid-template-columns:minmax(0,1fr)}
  .cal.week .dow{display:none}
  .cal.week .day{min-height:0}
  .cal.week .dwk{display:inline}
  .cal.week .dn{justify-content:flex-start;padding-left:10px}
  .daypanel{margin:12px 8px 24px}
  .unsch{margin:0 8px 28px}
}
.note{margin:10px 16px 0;font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.daypanel{margin:12px 16px 28px}
.daypanel h3,.panel h3{font:600 16px var(--head);margin:0 0 10px}
.drow{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:9px 0;text-align:left}
.drow:first-of-type{border-top:0}
.drow .t{flex:1;font-weight:500;min-width:0}
.drow .s{font-size:12px;color:var(--muted)}

/* epics */
.sec{font:700 20px var(--head);margin:0}
.epic{border-left:5px solid var(--ec)}
.eh{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:0;text-align:left}
.et{flex:1;font-weight:600;min-width:0}
.prog{display:flex;align-items:center;gap:10px;margin-top:10px}
.prog .track{flex:1}
.pt{font-size:13px;color:var(--muted);white-space:nowrap}
.qa{display:flex;gap:8px;margin-top:10px}
.qa input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.kids{margin-top:6px}
.kids>.kh{display:flex;align-items:center;gap:10px;margin-bottom:6px}

/* reports + settings */
.rep{padding:12px 16px 32px;display:grid;gap:14px;max-width:1000px}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.ctrl label{margin:0 0 4px}
.ctrl select,.ctrl input{width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}
.stat{background:var(--surface);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font:700 28px var(--head);letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}
.saved-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.saved{display:inline-flex;background:var(--chip);border-radius:99px;overflow:hidden}
.saved button{background:none;border:0;padding:5px 10px;font-size:14px}
.saved button+button{padding:5px 10px 5px 4px;color:var(--muted)}
.hb{display:grid;grid-template-columns:minmax(70px,120px) 1fr 76px;gap:8px;align-items:center;width:100%;background:none;border:0;padding:5px 4px;text-align:left;border-radius:8px}
.hb.on,.vcol.on,.leg.on{background:var(--chip)}
.hb .lbl{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:18px;background:var(--chip);border-radius:6px;overflow:hidden;display:block}
.hb.on .track{background:var(--surface)}
.fill{display:block;height:100%;border-radius:6px}
.val{font-weight:600;font-size:14px;text-align:right}
.val small,.leg small{color:var(--muted);font-weight:400}
.vb{display:flex;gap:6px;height:230px;overflow-x:auto;padding-bottom:2px}
.vcol{flex:1 0 46px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;background:none;border:0;padding:4px 2px;border-radius:8px}
.vv{font-size:13px;font-weight:600}
.bw{flex:1;display:flex;align-items:flex-end;width:100%}
.bar{display:block;width:100%;min-height:2px;border-radius:6px 6px 0 0}
.vl{font-size:11px;color:var(--muted);white-space:nowrap}
.donutwrap{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.donut{width:170px;height:170px;flex:0 0 auto}
.legend{flex:1 1 180px;display:grid;gap:2px}
.leg{display:flex;align-items:center;gap:8px;background:none;border:0;text-align:left;padding:6px 8px;border-radius:8px;font-size:14px}
.sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.leg .n{margin-left:auto;font-weight:600}
.fine{font-size:12px;color:var(--muted);margin:8px 0 0}
.srow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow input{flex:1 1 150px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.srow select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.srow .cnt{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:90;display:none}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(10,16,24,.55);display:none;align-items:flex-end;justify-content:center;z-index:60}
.overlay.open{display:flex}
.sheet{background:var(--surface);width:min(520px,100%);max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet.issue{width:100%;height:100%;max-height:100%;border-radius:0;padding-top:calc(16px + env(safe-area-inset-top,0px))}
@media (min-width:760px){
  .overlay{align-items:center}
  .sheet{border-radius:16px}
  .sheet.issue{width:min(960px,96%);height:auto;max-height:92vh;border-radius:16px;padding-top:20px}
}
.sheet h3{font:700 20px var(--head);margin:0 0 14px}
.sheet.wide{width:min(760px,100%)}
.sheet .srow input{width:auto}
.sheet .panel{margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.sheet input,.sheet select,.sheet textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.sheet input.h-title{font:700 22px var(--head);letter-spacing:-.01em;background:transparent;border-color:transparent;padding:6px 8px;margin-left:-8px;width:calc(100% + 8px)}
.sheet input.h-title:hover,.sheet input.h-title:focus{border-color:var(--line);background:var(--bg)}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.actions .spacer{flex:1}
.ih{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ih .sp{flex:1}
.ih .crumb-btn{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--muted);font-size:13px;font-weight:600}
.ih .x{background:var(--chip);border:0;border-radius:8px;width:34px;height:34px;font-size:20px;line-height:1;color:var(--muted)}
.ib{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "side" "act";gap:16px}
@media (min-width:760px){.ib{grid-template-columns:minmax(0,1fr) 270px;grid-template-areas:"top side" "act side";align-items:start}}
#i-top{grid-area:top;min-width:0}
#i-side{grid-area:side;min-width:0}
#i-act{grid-area:act;min-width:0}
.detail{border:1px solid var(--line);border-radius:12px;padding:4px 12px 14px}
.detail .ro{font-size:14px;padding:6px 0}
.detail .meta2{font-size:12px;color:var(--muted);margin-top:12px}
.linkbtn{background:none;border:0;color:var(--accent);font-size:13px;padding:2px 0;font-weight:600}
.acth{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.acth b{font:600 16px var(--head)}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:2px;margin-left:auto}
.seg button{background:none;border:0;border-radius:6px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.comp textarea{min-height:64px}
.comp .actions{margin-top:8px}
.ev{display:flex;gap:10px;padding:12px 0 0}
.ev .body{flex:1;min-width:0;font-size:14px}
.ev .when{font-size:12px;color:var(--muted);margin-left:6px;font-weight:400}
.ev .txt{white-space:pre-wrap;margin-top:2px;overflow-wrap:anywhere}
.ev .tools2{display:flex;gap:12px;margin-top:4px}
.ev .tools2 button{background:none;border:0;padding:0;font-size:12px;font-weight:600;color:var(--muted)}
.hv{display:inline-block;background:var(--chip);border-radius:5px;padding:0 6px;font-size:13px}
@media (prefers-reduced-motion:no-preference){.card{transition:opacity .15s}.fill,.bar{transition:all .25s}}

/* ---- Bid Scout theme ---- */
body{font-size:16px}
h1{font-weight:800;font-size:24px;letter-spacing:-.01em}
.brand{font-weight:800}
.panel,.stat,.detail{box-shadow:none;border:1px solid var(--line);border-radius:12px}
.card{box-shadow:none;border:1px solid var(--line);border-radius:10px}
.col{border:1px solid var(--line)}
.col h2{font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.panel h3,.acth b{font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.stat b{font-weight:800}
.btn{border:1px solid var(--line2);border-radius:8px;font-weight:600}
.btn.primary{border-color:var(--accent)}
.icon{border:1.5px solid var(--line2);border-radius:10px}
.filters input,.fsel select,.ctrl select,.ctrl input,.sheet input,.sheet select,.sheet textarea,.srow input,.srow select,.qa input,table.list select{border:1px solid var(--line2);border-radius:8px}
/* view switcher: pills, same look as Bid Scout's pill buttons */
.tabs{gap:6px;padding:10px 16px 2px;border-bottom:0;align-items:center}
.tab{border:1px solid var(--line2);border-radius:999px;padding:6px 14px;margin:0;font-size:13.5px;font-weight:600;color:var(--muted);background:transparent}
.tab:hover{border-color:var(--accent);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip{border:1.5px solid transparent;border-radius:99px;padding:1px 9px}
.chip.over{background:var(--highbg);color:var(--high);border-color:var(--high)}
.sbadge{border:1.5px solid transparent;border-radius:99px;padding:2px 10px}
.cat-todo{background:var(--chip);color:var(--muted);border-color:var(--line2)}
.cat-doing{background:var(--medbg);color:var(--med);border-color:var(--med)}
.cat-done{background:var(--lowbg);color:var(--low);border-color:var(--low)}
.linkbtn{color:var(--ink);font-weight:600}
.proj.on{box-shadow:inset 3px 0 0 #9AA7E8}
@media (max-width:640px){#theme .tl{display:none}}

/* ---- divisions, overview, team ---- */
.dtabs{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;align-items:flex-end}
.dtab{background:var(--col);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:8px 16px;font-weight:600;color:var(--muted);white-space:nowrap}
.dtab.on{background:var(--surface);color:var(--ink);border-color:var(--accent);font-weight:700}
.dtab.new{background:none;border:1px dashed var(--line2);border-bottom:0;padding:8px 14px}
.dtabs+.tabs{padding-top:0;border-top:2px solid var(--accent)}
img.who{object-fit:cover;background:var(--chip)}
.srow .who{width:32px;height:32px;font-size:12px}
.sbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--chip)}
.sbar i{display:block;height:100%}
.kpis{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tpl{border:1px solid var(--line);border-radius:10px;padding:4px 10px 8px;margin-top:10px}
#whoami{font-size:14px;overflow-wrap:anywhere}
.me .sl{padding-left:0}
</style>

<body>
<div class="app">
  <aside class="side" id="side" aria-label="Spaces">
    <div class="brand">Bid board</div>
    <div id="plist"></div>
    <div id="sfoot"></div>
    <div class="me"><label for="myname">Your name</label><input id="myname" maxlength="30" placeholder="Shown on comments"></div>
  </aside>
  <div class="scrim" id="scrim" data-scrim></div>
  <div class="main">
    <header class="top">
      <button class="icon" id="menu" data-menu aria-label="Open spaces"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4.5h14M2 9h14M2 13.5h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
      <div class="crumb"><small id="pkey"></small><h1 id="ptitle"></h1></div>
      <button class="btn small" id="theme" type="button"></button>
      <button class="btn primary" data-create id="createBtn">Create</button>
    </header>
    <nav class="dtabs" id="dtabs" aria-label="Divisions"></nav>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
    <div class="filters" id="filters">
      <input id="q" type="search" placeholder="Search bids" aria-label="Search bids">
      <div class="fsel" id="fsel"></div>
    </div>
    <main id="view"></main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<!-- day -->
<div class="overlay" id="ov-settings" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="sheet wide">
    <h3 id="setTitle">Settings</h3>
    <div id="orgSetBody"></div>
    <div class="actions"><span class="spacer"></span><button class="btn" data-close="ov-settings">Close</button></div>
  </div>
</div>

<div class="overlay" id="ov-day" role="dialog" aria-modal="true" aria-labelledby="dayTitle">
  <div class="sheet">
    <h3 id="dayTitle"></h3>
    <div id="dayList"></div>
    <div class="actions">
      <button class="btn small" id="dayAdd" data-add-due="">Create bid due this day</button>
      <span class="spacer"></span>
      <button class="btn" data-close="ov-day">Close</button>
    </div>
  </div>
</div>

<!-- issue -->
<div class="overlay" id="ov-issue" role="dialog" aria-modal="true" aria-label="Bid details">
  <div class="sheet issue">
    <div class="ih" id="i-head"></div>
    <div class="ib"><div id="i-top"></div><div id="i-side"></div><div id="i-act"></div></div>
  </div>
</div>

<!-- create issue -->
<div class="overlay" id="ov-create" role="dialog" aria-modal="true" aria-labelledby="cTitle">
  <div class="sheet">
    <h3 id="cTitle">Create bid</h3>
    <div class="row">
      <div><label for="c-type">Type</label><select id="c-type"></select></div>
      <div><label for="c-status">Status</label><select id="c-status"></select></div>
    </div>
    <label for="c-title">Summary</label>
    <input id="c-title" maxlength="140">
    <label for="c-desc">Description</label>
    <textarea id="c-desc"></textarea>
    <div class="row">
      <div><label for="c-pri">Priority</label><select id="c-pri"></select></div>
      <div><label for="c-who">Assignee</label><select id="c-who"></select></div>
    </div>
    <div class="row">
      <div><label for="c-due">Due date</label><input id="c-due" type="date"></div>
      <div><label for="c-labels">Labels</label><input id="c-labels" placeholder="design, bug"></div>
    </div>
    <div id="c-parent-wrap"><label for="c-parent" id="c-parent-label">Parent</label><select id="c-parent"></select></div>
    <div class="actions">
      <button class="btn primary" id="c-save">Create</button>
      <button class="btn" data-close="ov-create">Cancel</button>
    </div>
  </div>
</div>

<!-- create space -->
<div class="overlay" id="ov-space" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <div class="sheet">
    <h3 id="pTitle">Create space</h3>
    <label for="p-name">Space name</label>
    <input id="p-name" maxlength="40">
    <label for="p-key">Space key</label>
    <input id="p-key" maxlength="5" placeholder="Used in bid keys, like GEO-12">
    <label for="p-parent">Parent space</label>
    <select id="p-parent"></select>
    <label for="p-tpl">Workflow</label>
    <select id="p-tpl"></select>
    <p class="fine" id="p-err" style="color:var(--high)"></p>
    <div class="actions">
      <button class="btn primary" id="p-save">Create space</button>
      <button class="btn" data-close="ov-space">Cancel</button>
    </div>
  </div>
</div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
  var PKEY="site-board-v4-prefs";
  var TYPES=["Story","Task","Bug","Subtask"];
  var TGLYPH={Story:"S",Task:"T",Bug:"B",Subtask:"↳"};
  var TCOLOR={Story:"var(--c2)",Task:"var(--c1)",Bug:"var(--high)",Subtask:"var(--c5)"};
  var PRI=["Highest","High","Medium","Low"];
  var PGLYPH={Highest:"↑↑",High:"↑",Medium:"=",Low:"↓"};
  var PCOLOR={Highest:"var(--high)",High:"var(--high)",Medium:"var(--med)",Low:"var(--low)"};
  var CATS=[["todo","To do"],["doing","In progress"],["done","Done"]];
  var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var VIEWS=[["board","Board"],["list","List"],["calendar","Calendar"],["reports","Reports"],["settings","Settings"]];
  var GROUPS=[["status","Status"],["type","Type"],["priority","Priority"],["assignee","Assignee"],["label","Label"],["due","Due month"],["created","Created week"],["completed","Completed week"]];
  var TIME={due:1,created:1,completed:1};
  var state=null;
  var db=null,usr=null,ME="",ORG=false,CANWRITE=true,DENIED="";
  var D={config:{templates:[]},divs:[],archived:[],people:[],spaces:[]};
  var raw={config:null,divs:{},names:{},people:{},spaces:{},bids:{}},base={},PROF={};
  var loaded={config:false,divs:false,spaces:false,bids:false},scopeKey=null,unsubs=[],scopeUnsubs=[];
  var flushing=false,again=false,pendingLocal=false,rebuildPending=false,flushTimer=null,profBusy=false,READY=false;
  var TPL_DEFAULT=[{name:"To do",cat:"todo"},{name:"In progress",cat:"doing"},{name:"Done",cat:"done"}];
  var ui={f:{q:"",type:"",who:"",pri:""},sort:"num",dir:1,rsel:null,issueId:null,actTab:"all",draft:"",editC:null,armC:null,armI:false,armS:null,armP:false,armD:false,ar:{status:"",to:"",col:""},expanded:{},dragId:null,keyTouched:false,createPreset:{}};

  /* ---------- helpers ---------- */
  function $(id){return document.getElementById(id)}
  function pad(n){return n<10?"0"+n:""+n}
  function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
  function today(){return ymd(new Date())}
  function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
  function shortDate(s){var d=parse(s);return MONTHS[d.getMonth()]+" "+d.getDate()}
  function monthLabel(k){var p=k.split("-");return MONTHS[+p[1]-1]+" "+p[0]}
  function weekStart(s){var d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function initials(n){return n.trim().split(/\s+/).map(function(p){return p[0]}).join("").slice(0,2).toUpperCase()}
  function pct(n,t){return t?Math.round(n/t*100):0}
  function ago(ms){
    var s=Math.floor((Date.now()-ms)/1000);if(s<60)return "just now";
    var m=Math.floor(s/60);if(m<60)return m+" min ago";
    var h=Math.floor(m/60);if(h<24)return h+(h===1?" hour ago":" hours ago");
    var d=Math.floor(h/24);if(d<30)return d+(d===1?" day ago":" days ago");
    return new Date(ms).toLocaleDateString();
  }
  function toast(msg){var el=$("toast");el.textContent=msg;el.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){el.style.display="none"},2000)}
  function uid(p){return uuid()}

  /* ---------- model ---------- */
  function proj(){return curSpace()}
  function byId(id){var p=proj();return p?p.issues.filter(function(i){return i.id===id})[0]:undefined}
  function stat(p,id){return p.statuses.filter(function(s){return s.id===id})[0]||p.statuses[0]}
  function isDone(is){return stat(proj(),is.status).cat==="done"}
  function overdue(is){return !!is.due&&!isDone(is)&&is.due<today()}
  function ikey(is){return proj().key+"-"+is.num}
  function children(is){return proj().issues.filter(function(i){return i.parent===is.id})}
  function applyStatus(p,is,sid){
    is.status=sid;
    if(stat(p,sid).cat==="done"){if(!is.doneAt)is.doneAt=today()}else is.doneAt="";
  }
  function logH(is,field,from,to){is.history.push({by:ME,at:Date.now(),field:field,from:from,to:to})}
  function validParent(type,par){
    if(!par)return true;
    return type==="Subtask"&&par.type!=="Subtask";
  }
  function parentCandidates(type,selfId){
    if(type!=="Subtask")return [];
    return proj().issues.filter(function(i){return i.id!==selfId&&i.type!=="Subtask"});
  }
  function setField(is,f,v){
    var p=proj();
    if(f==="title"){v=v.trim();if(!v||v===is.title)return false;logH(is,"Summary",is.title,v);is.title=v}
    else if(f==="desc"){v=v.trim();if(v===is.desc)return false;is.desc=v;logH(is,"Description","","")}
    else if(f==="status"){if(v===is.status)return false;logH(is,"Status",stat(p,is.status).name,stat(p,v).name);applyStatus(p,is,v)}
    else if(f==="assignee"){if(v===is.assignee)return false;logH(is,"Assignee",is.assignee||"",v||"");is.assignee=v}
    else if(f==="priority"){if(v===is.priority)return false;logH(is,"Priority",is.priority,v);is.priority=v}
    else if(f==="type"){
      if(v===is.type)return false;logH(is,"Type",is.type,v);is.type=v;
      var par=is.parent?byId(is.parent):null;if(!validParent(v,par))is.parent="";
    }
    else if(f==="parent"){
      if(v===is.parent)return false;
      var np=v?byId(v):null,op=is.parent?byId(is.parent):null;
      logH(is,"Parent",op?ikey(op):"None",np?ikey(np):"None");is.parent=v;
    }
    else if(f==="labels"){
      var arr=v.split(",").map(function(s){return s.trim()}).filter(Boolean);
      if(arr.join(",")===is.labels.join(","))return false;
      logH(is,"Labels",is.labels.join(", ")||"None",arr.join(", ")||"None");is.labels=arr;
    }
    else if(f==="due"){if(v===is.due)return false;logH(is,"Due date",is.due?shortDate(is.due):"None",v?shortDate(v):"None");is.due=v}
    else return false;
    is.updated=Date.now();save();render();return true;
  }
  function createIssue(data){
    var p=proj(),mx=p.issues.reduce(function(a,i){return Math.max(a,i.num)},0),num=Math.max(p.next||1,mx+1);
    var mr=p.issues.reduce(function(a,i){return Math.max(a,rk(i))},0);
    p.next=num+1;
    var is={id:newId("bids"),num:num,rank:mr+1000,spaceId:p.id,divisionId:p.divisionId,type:data.type,title:data.title,desc:data.desc||"",status:data.status||p.statuses[0].id,
      priority:data.priority||"Medium",assignee:data.assignee||"",reporter:ME,labels:data.labels||[],due:data.due||"",
      created:today(),doneAt:"",updated:Date.now(),parent:data.parent||"",comments:[],history:[{by:ME,at:Date.now(),field:"created"}]};
    applyStatus(p,is,is.status);
    p.issues.push(is);save();return is;
  }
  function deleteIssue(id){
    var p=proj();
    p.issues=p.issues.filter(function(i){return !(i.parent===id&&i.type==="Subtask")&&i.id!==id});
    p.issues.forEach(function(i){if(i.parent===id)i.parent=""});
    save();
  }
  function moveTo(id,sid,beforeId){
    var p=proj(),is=byId(id);if(!is)return;
    if(is.status!==sid){logH(is,"Status",stat(p,is.status).name,stat(p,sid).name);applyStatus(p,is,sid);is.updated=Date.now()}
    var col=p.issues.filter(function(x){return x.status===sid&&x.id!==id}).sort(function(a,b){return rk(a)-rk(b)});
    var j=beforeId?col.findIndex(function(x){return x.id===beforeId}):-1;
    if(j<0)is.rank=(col.length?rk(col[col.length-1]):0)+1000;
    else is.rank=j>0?(rk(col[j-1])+rk(col[j]))/2:rk(col[0])-1000;
    p.issues.sort(function(a,b){return rk(a)-rk(b)});
    save();render();
  }

  /* ---------- preferences (this device only) ---------- */
  function defaultPrefs(){
    var T=today();
    return {view:"board",div:"",cur:"",calMonth:T.slice(0,7),calSel:T,calMode:"month",listCols:null,theme:"auto",
      rcfg:{groupBy:"status",chart:"bar",scope:"all",type:"",pri:"",who:"",label:"",name:""},
      reports:[
        {name:"Workload by assignee",cfg:{groupBy:"assignee",chart:"bar",scope:"open",type:"",pri:"",who:"",label:""}},
        {name:"Overdue by priority",cfg:{groupBy:"priority",chart:"donut",scope:"overdue",type:"",pri:"",who:"",label:""}},
        {name:"Completed per week",cfg:{groupBy:"completed",chart:"bar",scope:"done",type:"",pri:"",who:"",label:""}}
      ]};
  }
  function loadPrefs(){
    try{var r=localStorage.getItem(PKEY);if(r)return Object.assign(defaultPrefs(),JSON.parse(r))}catch(e){}
    return defaultPrefs();
  }
  function savePrefs(){try{localStorage.setItem(PKEY,JSON.stringify(state))}catch(e){}}
  function orgView(v){return v==="overview"||v==="orgsettings"}
  function archivedBlocked(){
    if(orgView(state.view)||!isArchived(state.div))return false;
    var m=allDocs(),dirty=false;
    Object.keys(m).forEach(function(p){if(base[p]!==canon(m[p]))dirty=true});
    Object.keys(base).forEach(function(p){if(!(p in m)&&p!=="org/config")dirty=true});
    if(!dirty)return false;
    toast("This division is archived, so it can’t be changed.");
    setTimeout(rebuild,0);
    return true;
  }
  function save(){savePrefs();if(archivedBlocked())return;syncTemplates();scheduleFlush()}

  /* ---------- shared store (Supabase) ---------- */
  var sb=null,CFG=window.APP_CONFIG||{},reloadTimer=null,handoffDone=false;
  function canon(v){
    if(v===null||typeof v!=="object")return JSON.stringify(v===undefined?null:v);
    if(Array.isArray(v))return "["+v.map(canon).join(",")+"]";
    return "{"+Object.keys(v).sort().map(function(k){return JSON.stringify(k)+":"+canon(v[k])}).join(",")+"}";
  }
  function clone(o){return JSON.parse(JSON.stringify(o))}
  function uuid(){
    if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==="x"?r:(r&3|8)).toString(16)});
  }
  function newId(){return uuid()}
  function byName(a,b){return (a.name||"").localeCompare(b.name||"")}
  function rk(i){return i.rank!=null?i.rank:i.num*1000}
  function strip(o){var c={};Object.keys(o).forEach(function(k){if(k!=="id")c[k]=o[k]});return c}
  function stripSpace(sp){var c={};Object.keys(sp).forEach(function(k){if(k!=="issues"&&k!=="id")c[k]=sp[k]});return c}
  function nz(s){return s?s:null}

  /* rows <-> documents */
  function rowToSpace(r){return {divisionId:String(r.division_id),parentId:r.parent_id||"",name:r.name,key:r.key,ci:r.ci||0,next:r.next||1,statuses:r.statuses||[],rules:r.rules||[],created:(r.created_at||"").slice(0,10)}}
  function spaceToRow(id,d){return {id:id,division_id:d.divisionId,parent_id:d.parentId||null,name:d.name,key:d.key,ci:d.ci||0,next:d.next||1,statuses:d.statuses||[],rules:d.rules||[]}}
  function rowToBid(r){return {num:r.num,rank:r.rank,spaceId:r.space_id,divisionId:String(r.division_id),type:r.type,title:r.title,desc:r.descr||"",status:r.status,priority:r.priority,assignee:r.assignee||"",reporter:r.reporter||"",labels:r.labels||[],due:r.due||"",created:r.created||"",doneAt:r.done_at||"",updated:r.updated_at?Date.parse(r.updated_at):0,parent:r.parent_id||"",comments:r.comments||[],history:r.history||[],sourceProjectId:r.source_project_id||"",sourceUrl:r.source_url||"",originBidId:r.origin_bid_id||""}}
  function bidToRow(id,d){return {id:id,space_id:d.spaceId,division_id:d.divisionId,num:d.num,rank:d.rank!=null?d.rank:d.num*1000,type:d.type,title:d.title,descr:d.desc||"",status:d.status,priority:d.priority,assignee:d.assignee||null,reporter:d.reporter||"",labels:d.labels||[],due:nz(d.due),created:d.created||today(),done_at:nz(d.doneAt),parent_id:d.parent||null,comments:d.comments||[],history:d.history||[],source_project_id:d.sourceProjectId||null,source_url:d.sourceUrl||null,origin_bid_id:d.originBidId||null,updated_at:new Date(d.updated||Date.now()).toISOString()}}

  function allDocs(){
    var m={};
    m["org/config"]={templates:D.config.templates};
    D.people.forEach(function(p){m["people/"+p.id]={divisionId:p.divisionId,name:p.name}});
    D.spaces.forEach(function(sp){
      m["spaces/"+sp.id]=stripSpace(sp);
      sp.issues.forEach(function(is){m["bids/"+is.id]=strip(is)});
    });
    return m;
  }
  function rawPut(path,data){
    var p=path.split("/");
    if(p[0]==="org")raw.config=data;
    else if(p[0]==="people")raw.people[p[1]]=data;
    else if(p[0]==="spaces")raw.spaces[p[1]]=data;
    else if(p[0]==="bids")raw.bids[p[1]]=data;
  }
  function rawDel(path){
    var p=path.split("/");
    if(p[0]==="people")delete raw.people[p[1]];
    else if(p[0]==="spaces")delete raw.spaces[p[1]];
    else if(p[0]==="bids")delete raw.bids[p[1]];
  }
  async function writeTemplates(list){
    var keep={},i,r;
    for(i=0;i<list.length;i++){
      keep[list[i].id]=1;
      r=await sb.from("wf_templates").upsert({id:list[i].id,name:list[i].name,statuses:list[i].statuses});
      if(r.error)throw r.error;
    }
    var old=(raw.config&&raw.config.templates)||[];
    for(i=0;i<old.length;i++){
      if(!keep[old[i].id]){r=await sb.from("wf_templates").delete().eq("id",old[i].id);if(r.error)throw r.error}
    }
  }
  async function writeDoc(path,data){
    var p=path.split("/"),id=p[1],r=null;
    if(p[0]==="org")return writeTemplates(data.templates);
    if(p[0]==="spaces")r=await sb.from("wf_spaces").upsert(spaceToRow(id,data));
    else if(p[0]==="bids")r=await sb.from("wf_bids").upsert(bidToRow(id,data));
    else if(p[0]==="people")r=await sb.from("wf_people").upsert({id:id,division_id:data.divisionId,name:data.name});
    if(r&&r.error)throw r.error;
  }
  async function deleteDoc(path){
    var p=path.split("/"),t={people:"wf_people",spaces:"wf_spaces",bids:"wf_bids"}[p[0]];
    if(!t)return;
    var r=await sb.from(t).delete().eq("id",p[1]);
    if(r.error)throw r.error;
  }
  function scheduleFlush(){
    if(!sb||!READY)return;
    pendingLocal=true;clearTimeout(flushTimer);flushTimer=setTimeout(runFlush,0);
  }
  async function runFlush(){
    if(flushing){again=true;return}
    flushing=true;
    try{
      do{
        again=false;
        var m=allDocs(),ops=[];
        Object.keys(m).forEach(function(p){var c=canon(m[p]);if(base[p]!==c)ops.push({p:p,c:c})});
        Object.keys(base).forEach(function(p){if(!(p in m)&&p!=="org/config")ops.push({p:p,del:true})});
        for(var i=0;i<ops.length;i++){
          var o=ops[i];
          try{
            if(o.del){await deleteDoc(o.p);delete base[o.p];rawDel(o.p)}
            else{var data=JSON.parse(o.c);await writeDoc(o.p,data);base[o.p]=o.c;rawPut(o.p,data)}
          }catch(err){console.error("save failed",o.p,err);toast("Couldn’t save a change: "+((err&&err.message)||"unknown error"));again=false;break}
        }
      }while(again);
    }finally{
      flushing=false;pendingLocal=false;
      if(rebuildPending)setTimeout(function(){if(!pendingLocal&&!flushing&&rebuildPending){rebuildPending=false;rebuild()}},250);
    }
  }

  /* loading and live updates */
  function onLoadErr(e){DENIED="Can’t reach the database. "+((e&&e.message)||"");console.error(e);render()}
  async function loadAll(){
    var dt=CFG.DIVISIONS_TABLE||"divisions",idc=CFG.DIVISION_ID_COLUMN||"id",nc=CFG.DIVISION_NAME_COLUMN||"name";
    var rs=await Promise.all([
      sb.from(dt).select("*"),sb.from("wf_people").select("*"),sb.from("wf_templates").select("*").order("created_at"),
      sb.from("wf_spaces").select("*"),sb.from("wf_bids").select("*").limit(5000),sb.from("wf_division_names").select("*")]);
    for(var i=0;i<5;i++)if(rs[i].error)throw rs[i].error;
    raw.divs={};rs[0].data.forEach(function(r){raw.divs[String(r[idc])]={name:String(r[nc]!=null?r[nc]:r[idc])}});
    raw.people={};rs[1].data.forEach(function(r){raw.people[r.id]={divisionId:String(r.division_id),name:r.name}});
    raw.config={templates:rs[2].data.map(function(r){return {id:r.id,name:r.name,statuses:r.statuses||[]}})};
    raw.spaces={};rs[3].data.forEach(function(r){raw.spaces[r.id]=rowToSpace(r)});
    raw.bids={};rs[4].data.forEach(function(r){raw.bids[r.id]=rowToBid(r)});
    raw.names={};if(!rs[5].error)(rs[5].data||[]).forEach(function(r){raw.names[String(r.division_id)]={name:r.name,archivedAt:r.archived_at||""}});
    loaded.config=loaded.divs=loaded.spaces=loaded.bids=true;
    dataChanged();
    snapshotNames();
  }
  function scheduleReload(){clearTimeout(reloadTimer);reloadTimer=setTimeout(function(){loadAll().catch(function(e){console.error(e)})},300)}
  function listen(){
    try{
      var ch=sb.channel("wf-changes");
      ["wf_spaces","wf_bids","wf_people","wf_templates"].forEach(function(t){ch.on("postgres_changes",{event:"*",schema:"public",table:t},scheduleReload)});
      ch.subscribe();
    }catch(e){console.warn("realtime unavailable, polling instead",e)}
    setInterval(function(){if(!document.hidden&&!flushing&&!pendingLocal)scheduleReload()},30000);
    document.addEventListener("visibilitychange",function(){if(!document.hidden)scheduleReload()});
  }
  function ensureScope(){}
  /* remember each live division's name so it can be shown by name if it is later deleted in Bid Scout */
  function snapshotNames(){
    if(!sb)return;
    var rows=[];
    Object.keys(raw.divs).forEach(function(id){
      var n=raw.names[id];
      if(!n||n.name!==raw.divs[id].name||n.archivedAt)rows.push({division_id:id,name:raw.divs[id].name,archived_at:null,updated_at:new Date().toISOString()});
    });
    if(!rows.length)return;
    Promise.resolve(sb.from("wf_division_names").upsert(rows)).then(function(r){
      if(r&&!r.error)rows.forEach(function(x){raw.names[x.division_id]={name:x.name,archivedAt:""}});
    },function(){});
  }
  function dataChanged(){
    READY=true;
    if(flushing||pendingLocal){rebuildPending=true;return}
    rebuild();
  }
  function rebuild(){
    D.config={templates:clone((raw.config&&raw.config.templates)||[])};
    D.people=Object.keys(raw.people).map(function(id){var p=raw.people[id];return {id:id,divisionId:p.divisionId,name:p.name}}).sort(byName);
    D.people.forEach(function(p){PROF[p.id]={name:p.name,avatarUrl:""}});
    D.divs=Object.keys(raw.divs).map(function(id){return {id:id,name:raw.divs[id].name,members:[],admins:[]}}).sort(byName);
    var seenIds={};
    D.people.forEach(function(p){seenIds[p.divisionId]=1});
    Object.keys(raw.spaces).forEach(function(id){seenIds[raw.spaces[id].divisionId]=1});
    D.archived=Object.keys(seenIds).filter(function(id){return !raw.divs[id]}).map(function(id){
      var n=raw.names[id]||{};
      return {id:id,name:n.name||"Archived division",archivedAt:n.archivedAt||"",archived:true,members:[],admins:[]};
    }).sort(byName);
    var map={};
    D.spaces=Object.keys(raw.spaces).map(function(id){var s=clone(raw.spaces[id]);s.id=id;s.issues=[];s.statuses=s.statuses||[];map[id]=s;return s}).sort(byName);
    Object.keys(raw.bids).forEach(function(id){
      var b=clone(raw.bids[id]),s=map[b.spaceId];b.id=id;
      if(!s)return;
      b.comments=b.comments||[];b.history=b.history||[];b.labels=b.labels||[];
      s.issues.push(b);
    });
    D.spaces.forEach(function(s){s.issues.sort(function(a,b){return rk(a)-rk(b)})});
    base={};
    var snapshotDocs=allDocs();
    Object.keys(snapshotDocs).forEach(function(p){base[p]=canon(snapshotDocs[p])});
    if(syncTemplates())scheduleFlush();   // a template changed elsewhere, or a space can start following one
    fixSelection();
    render();
    handoff();
  }
  function fixSelection(){
    var vis=myDivs();
    if(!orgView(state.view)&&!vis.concat(D.archived).some(function(d){return d.id===state.div})){
      state.div=vis.length?vis[0].id:"";state.cur="";
      if(!state.div)state.view="board";
    }
    if(!divSpaces(state.div).some(function(s){return s.id===state.cur})){
      var tr=spaceTree(state.div);state.cur=tr.length?tr[0].sp.id:"";
    }
    savePrefs();
  }
  /* links from Bid Scout: ?bid=<id> opens a bid, ?division=<id> opens a division */
  function handoff(){
    if(handoffDone)return;
    handoffDone=true;
    var q=new URLSearchParams(location.search),bid=q.get("bid"),div=q.get("division");
    if(!bid&&!div)return;
    try{history.replaceState(null,"",location.pathname)}catch(e){}
    if(bid){
      var found=D.spaces.some(function(s){return s.issues.some(function(i){return i.id===bid})});
      if(found){gotoBid(bid);return}
      toast("That bid wasn’t found.");

    if(div&&D.divs.some(function(d){return d.id===String(div)}))switchDiv(String(div));
  }

  function childSpaces(sp){return D.spaces.filter(function(s){return s.parentId===sp.id})}

      h+='<div class="srow"><div style="flex:1 1 220px;min-width:0">When a bid enters <b>'+esc(r.status)+'</b>, add a copy to <b>'+esc(t?t.name:"a deleted space")+'</b>'+(r.col?' in <b>'+esc(r.col)+'</b>':' in its first column')+
        (warn?'<div class="fine" style="color:var(--high);margin:2px 0 0">'+warn+'</div>':'')+'</div><button class="btn small danger" data-delrule="'+esc(r.id)+'">Remove</button></div>';

  }

  /* ---------- divisions and spaces ---------- */
  function curDiv(){return D.divs.concat(D.archived).filter(function(d){return d.id===state.div})[0]||null}
  function isArchived(id){return D.archived.some(function(d){return d.id===id})}
  function divSpaces(divId){return D.spaces.filter(function(s){return s.divisionId===divId})}
  function curSpace(){return divSpaces(state.div).filter(function(s){return s.id===state.cur})[0]||null}

  function teamIds(d){return D.people.filter(function(p){return p.divisionId===d.id}).map(function(p){return p.id})}
  function teamOptions(cur){
    var d=curDiv(),ids=d?teamIds(d):[];

  function spaceTree(divId){
    var list=divSpaces(divId),ids={},out=[];
    list.forEach(function(s){ids[s.id]=1});
    function walk(pid,depth){
      list.filter(function(s){return pid===""?(!s.parentId||!ids[s.parentId]):s.parentId===pid}).forEach(function(s){out.push({sp:s,depth:depth});walk(s.id,depth+1)});
    }
    walk("",0);
    return out;
  }
  function descendants(id){
    var out=[id];
    D.spaces.forEach(function(s){
      if(s.parentId===id&&out.indexOf(s.id)<0)descendants(s.id).forEach(function(x){if(out.indexOf(x)<0)out.push(x)});
    });
    return out;
  }

  /* ---------- list ---------- */
  function sortVal(is,k){
    var p=proj();
    if(k==="num")return is.num;
    if(k==="status")return p.statuses.findIndex(function(s){return s.id===is.status});
    if(k==="priority")return PRI.indexOf(is.priority);
    if(k==="due")return is.due||"9999";
    return (is[k]||"~").toLowerCase();
  }
  function cmp(a,b){var x=sortVal(a,ui.sort),y=sortVal(b,ui.sort);return (x<y?-1:x>y?1:0)*ui.dir}
  var LCOLS={num:"Key",title:"Summary",status:"Status",priority:"Priority",assignee:"Assignee",due:"Due date"};
  function listOrder(){
    var def=["num","title","status","priority","assignee","due"],o=(state.listCols||[]).filter(function(k){return def.indexOf(k)>-1});
    def.forEach(function(k){if(o.indexOf(k)<0)o.push(k)});

  function moveCol(from,to){

    if(k==="status")return '<td><select data-status="'+is.id+'" aria-label="Status for '+ikey(is)+'">'+p.statuses.map(function(s){return opt(s.id,s.name,is.status)}).join("")+'</select></td>';
    if(k==="priority")return '<td><span class="kc">'+prHTML(is.priority)+' '+is.priority+'</span></td>';

  function groupKeys(t,g){

  function nextMonth(k){var p=k.split("-"),d=new Date(+p[0],+p[1],1);return d.getFullYear()+"-"+pad(d.getMonth()+1)}
  function buildGroups(list,g){
    var map={};
    list.forEach(function(t){groupKeys(t,g).forEach(function(k){(map[k]=map[k]||[]).push(t)})});
    var keys=Object.keys(map);
    if(g==="status")keys=proj().statuses.map(function(s){return s.id});
    else if(g==="priority")keys=PRI.slice();
    else if(g==="type")keys=TYPES.slice();
    else if(TIME[g]){
      var real=keys.filter(function(k){return /^\d/.test(k)}).sort(),extra=keys.filter(function(k){return !/^\d/.test(k)}),filled=[];
      if(real.length){var k=real[0],last=real[real.length-1],guard=0;while(k<=last&&guard++<240){filled.push(k);k=g==="due"?nextMonth(k):addDays(k,7)}}
      keys=filled.concat(extra);
    }else keys.sort(function(a,b){return map[b].length-map[a].length||a.localeCompare(b)});
    return keys.map(function(k){return {key:k,label:keyLabel(g,k),items:map[k]||[]}});

  function tplStatuses(id){
    ensureTplIds();
    var t=D.config.templates.filter(function(x){return x.id===id})[0];
    if(!t)return TPL_DEFAULT.map(function(x){return {id:uid("s"),name:x.name,cat:x.cat}});
    return t.statuses.map(function(x){return {id:uid("s"),name:x.name,cat:x.cat,tpl:t.id,tc:x.id}});
  }

  /* A space made from (or applied) an org template follows it: each of its columns carries
     tpl (template id) + tc (template column id), and editing the template updates every
     following space — renames, reorders, categories, added and removed columns. Editing a
     space's own columns stops it following (tpl set to ""). */
  function ensureTplIds(){
    var ch=false;
    D.config.templates.forEach(function(t){
      var used={};t.statuses.forEach(function(c){if(c.id)used[c.id]=1});
      t.statuses.forEach(function(c,i){if(!c.id){var k="c"+i;while(used[k])k+="x";c.id=k;used[k]=1;ch=true}});
    });
    return ch;
  }
  function followedTpl(sp){
    var st=sp.statuses;
    if(!st.length||!st[0].tpl)return null;
    if(st.some(function(c){return c.tpl!==st[0].tpl||!c.tc}))return null;
    return D.config.templates.filter(function(t){return t.id===st[0].tpl})[0]||null;
  }
  function unfollow(sp){sp.statuses.forEach(function(c){c.tpl="";delete c.tc})}
  // A space that never followed anything (e.g. the "Bid Scout inbox" made by the database)
  // starts following a template whose column names match its own, in order.
  function adoptTpl(sp){
    if(sp.statuses.some(function(c){return "tpl" in c}))return null;
    var names=sp.statuses.map(function(c){return c.name.toLowerCase()}).join("|");
    var t=D.config.templates.filter(function(t){return t.statuses.map(function(c){return c.name.toLowerCase()}).join("|")===names})[0];
    if(!t)return null;
    sp.statuses.forEach(function(c,i){c.tpl=t.id;c.tc=t.statuses[i].id});
    return t;
  }
  function syncSpaceToTpl(sp,t){
    var old=sp.statuses,byTc={},ids={};
    old.forEach(function(c){byTc[c.tc]=c;ids[c.id]=1});
    var next=t.statuses.map(function(c){
      var o=byTc[c.id],id=o?o.id:(ids[c.id]?uid("s"):c.id);
      return {id:id,name:c.name,cat:c.cat,tpl:t.id,tc:c.id};
    });
    if(canon(next)===canon(old))return false;
    sp.statuses=next;
    var keep={};next.forEach(function(c){keep[c.id]=c});
    sp.issues.forEach(function(is){
      if(keep[is.status]){applyStatus(sp,is,is.status);return}   // category may have changed
      // its column was removed from the template: move it to the nearest earlier column still there
      var oi=old.findIndex(function(c){return c.id===is.status}),to=null;
      for(var k=oi-1;k>=0&&!to;k--)if(keep[old[k].id])to=old[k].id;
      if(!to)to=next[0].id;
      logH(is,"Status",oi>-1?old[oi].name:"",keep[to].name);
      applyStatus(sp,is,to);
    });
    return true;
  }
  function syncTemplates(){
    var ch=ensureTplIds();
    D.spaces.forEach(function(sp){
      if(isArchived(sp.divisionId))return;
      var t=followedTpl(sp)||adoptTpl(sp);
      if(t&&syncSpaceToTpl(sp,t))ch=true;
    });
    return ch;
  }
  function applyTemplate(p,tpl){
    var old=p.statuses.slice();
    if(!tpl.statuses.length)return;
    p.statuses=tplStatuses(tpl.id);
    p.issues.forEach(function(is){
      var os=old.filter(function(x){return x.id===is.status})[0]||old[0];
      var nt=p.statuses.filter(function(x){return x.name.toLowerCase()===os.name.toLowerCase()})[0]||p.statuses.filter(function(x){return x.cat===os.cat})[0]||p.statuses[0];

  function render(){
    var v=state.view,d=curDiv(),p=proj();
    var loading=!(loaded.config&&loaded.divs&&loaded.spaces&&loaded.bids);
    if(v==="settings"&&d&&!isDivAdmin(d))v=state.view="board";
    if(v==="division"||orgView(v))v=state.view="board";   // members live in a space's Settings; org settings is a window
    renderSide();renderDivTabs();
    if(v==="division"&&d){$("pkey").textContent=d.name;$("ptitle").textContent="Division settings"}
    else if(p){$("pkey").textContent=(d?d.name+" · ":"")+p.key;$("ptitle").textContent=p.name}
    else{$("pkey").textContent=d?"Division":"";$("ptitle").textContent=d?d.name:"Bid board"}
    var spaceView=["board","list","calendar","reports","settings"].indexOf(v)>-1;
    var showTabs=spaceView&&!!p&&!loading&&!DENIED&&!!d;
    $("tabs").style.display=showTabs?"":"none";
    $("tabs").innerHTML=VIEWS.filter(function(x){return x[0]!=="settings"||isDivAdmin(d)}).map(function(x){return '<button class="tab" role="tab" data-view="'+x[0]+'" aria-selected="'+(v===x[0])+'">'+x[1]+'</button>'}).join("");
    var showF=showTabs&&["board","list","calendar"].indexOf(v)>-1;
    $("filters").style.display=showF?"":"none";
    if(showF)renderFsel();
    $("createBtn").style.display=(showTabs&&canAct())?"":"none";
    var html;
    if(DENIED)html=emptyHTML("Can’t open the bid board",esc(DENIED));
    else if(loading)html='<div class="rep"><p class="fine" style="font-size:14px">Loading…</p></div>';
    else if(!d)html=noDivisionHTML();
    else if(v==="division")html=divisionHTML(d);
    else if(!p)html=noSpaceHTML(d);
    else html=v==="list"?listHTML():v==="calendar"?calHTML():v==="reports"?reportsHTML():v==="settings"?settingsHTML():boardHTML();
    if(!DENIED&&!loading&&!CANWRITE)html='<p class="note">You have view-only access, so changes won’t be saved.</p>'+html;
    if(!DENIED&&!loading&&!orgView(v)&&isArchived(state.div))html='<p class="note">Archived: this division was deleted in Bid Scout. Its data is kept for reference and can’t be changed.</p>'+html;
    $("view").innerHTML=html;
    if($("ov-settings").classList.contains("open"))$("orgSetBody").innerHTML=orgSettingsHTML();
  }

  document.addEventListener("input",function(e){
    var el=e.target;
    if(el.id==="q"){ui.f.q=el.value;render();return}
    if(el.id==="rname"){state.rcfg.name=el.value;el.style.borderColor="";save();return}
    if(el.id==="c-new"){ui.draft=el.value;return}
    if(el.id==="p-name"&&!ui.keyTouched){$("p-key").value=autoKey(el.value);return}
    if(el.id==="p-key"){ui.keyTouched=true;el.value=el.value.toUpperCase().replace(/[^A-Z0-9]/g,"")}
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){closeTop();return}
    var t=e.target;
    var day=t.closest&&t.closest("[data-day]");
    if(day&&t===day&&(e.key==="Enter"||e.key===" ")){e.preventDefault();state.calSel=day.getAttribute("data-day");save();render();return}
    if(e.key==="Enter"&&t.getAttribute&&t.getAttribute("data-quick")){e.preventDefault();quickAdd(t.getAttribute("data-quick"));return}
    if(e.key==="Enter"&&t.id==="ns"){e.preventDefault();var b=document.querySelector("[data-addstatus]");if(b)b.click()}
    if(e.key==="Enter"&&(t.id==="c-title"||t.id==="p-name"||t.id==="p-key")){e.preventDefault();if(t.id==="c-title")submitCreate();else submitSpace()}
    if(e.key==="Enter"&&t.id==="newperson"){e.preventDefault();var ab=document.querySelector("[data-addperson]");if(ab)ab.click()}
  });
  /* drag and drop on the board */
  var view=$("view");
  view.addEventListener("dragstart",function(e){
    var th=e.target.closest("[data-lcol]");
    if(th){ui.dragCol=th.getAttribute("data-lcol");try{e.dataTransfer.setData("text/plain",ui.dragCol);e.dataTransfer.effectAllowed="move"}catch(x){}return}
    var c=e.target.closest(".card,[data-iid]");if(!c)return;
    ui.dragId=c.getAttribute("data-id")||c.getAttribute("data-iid");c.classList.add("dragging");
    try{e.dataTransfer.setData("text/plain",ui.dragId);e.dataTransfer.effectAllowed="move"}catch(x){}
  });
  view.addEventListener("dragend",function(){ui.dragId=null;ui.dragCol=null;render()});
  view.addEventListener("dragover",function(e){
    var th=e.target.closest("[data-lcol]");
    if(th&&ui.dragCol){e.preventDefault();Array.prototype.forEach.call(view.querySelectorAll(".th-over"),function(x){x.classList.remove("th-over")});th.classList.add("th-over");return}
    var dy=e.target.closest("[data-day]");
    if(dy&&ui.dragId){e.preventDefault();Array.prototype.forEach.call(view.querySelectorAll(".day.drop"),function(x){x.classList.remove("drop")});dy.classList.add("drop");return}
    var col=e.target.closest(".col");if(!col||!ui.dragId)return;
    e.preventDefault();
    Array.prototype.forEach.call(view.querySelectorAll(".col.over"),function(x){x.classList.remove("over")});
    col.classList.add("over");
  });
  view.addEventListener("drop",function(e){
    var th=e.target.closest("[data-lcol]");
    if(th&&ui.dragCol){e.preventDefault();var from=ui.dragCol;ui.dragCol=null;moveCol(from,th.getAttribute("data-lcol"));return}
    var dy=e.target.closest("[data-day]");
    if(dy&&ui.dragId){e.preventDefault();var did0=ui.dragId;ui.dragId=null;var di=byId(did0);if(di)setField(di,"due",dy.getAttribute("data-day"));return}
    var col=e.target.closest(".col");if(!col||!ui.dragId)return;
    e.preventDefault();
    var over=e.target.closest(".card");
    var before=over&&over.getAttribute("data-id")!==ui.dragId?over.getAttribute("data-id"):null;
    var id=ui.dragId;ui.dragId=null;
    moveTo(id,col.getAttribute("data-col"),before);
  });

  var THEMES=["auto","light","dark"],TGL={auto:"◐",light:"☀",dark:"☾"},TLBL={auto:"Auto",light:"Light",dark:"Dark"};
  function applyTheme(){
    var t=state.theme||"auto",r=document.documentElement;
    if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);
    $("theme").innerHTML='<span aria-hidden="true">'+TGL[t]+'</span><span class="tl"> '+TLBL[t]+'</span>';
    $("theme").setAttribute("aria-label","Theme: "+TLBL[t]+". Tap to change.");
  }
  $("theme").addEventListener("click",function(){
    var i=THEMES.indexOf(state.theme||"auto");
    state.theme=THEMES[(i+1)%THEMES.length];save();applyTheme();
    try{localStorage.setItem("bidscout_theme",state.theme)}catch(e){}
  });
  $("c-save").addEventListener("click",submitCreate);
  $("p-save").addEventListener("click",submitSpace);

  state=loadPrefs();
  ORG=true;CANWRITE=true;ME=state.myName||"Someone";
  // Same switch as Bid Scout (served from the same site, so same localStorage).
  try{var bt=localStorage.getItem("bidscout_theme");if(THEMES.indexOf(bt)>=0)state.theme=bt}catch(e){}
  applyTheme();applySide();
  render();
  (function boot(){
    $("myname").value=state.myName||"";
    if(!window.supabase||!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY){
      DENIED="The app isn’t configured. Set SUPABASE_URL and SUPABASE_ANON_KEY (see the README).";render();return;
    }
    try{sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}})}
    catch(e){onLoadErr(e);return}
    if(!state.div)state.view="board";
    loadAll().then(listen).catch(onLoadErr);
  })();
})();
</script>
</body>
</html>
