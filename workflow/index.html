<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161B33">
<title>Bid board</title>
<style>
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --ink:#1B2140; --muted:#5A607C; --line:#D5DAE5; --line2:#BFC5D4;
  --accent:#222B57; --accent-ink:#FFFFFF; --col:#E7E9F0; --high:#B8362B; --med:#A8701A; --low:#2F7A47;
  --highbg:#FBE6E3; --medbg:#F7EBD3; --lowbg:#E3F1E6; --chip:#E9ECF3; --shadow:none;
  --c1:#3D4DA3; --c2:#2F8F7B; --c3:#B8761F; --c4:#A2447F; --c5:#7A809B; --c6:#6B57C7;
  --side-bg:#161B33; --side-ink:#DDE1F0; --side-mute:#8E96B8; --side-hi:rgba(255,255,255,.1);
  --head:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1022; --surface:#171C30; --ink:#E8EAF3; --muted:#A3A9C4; --line:#2B3152; --line2:#3B4268;
    --accent:#8E9AD6; --accent-ink:#10142B; --col:#20253D; --high:#F08A80; --med:#D2A24E; --low:#6FBF86;
    --highbg:#3A1D21; --medbg:#2C2517; --lowbg:#16291F; --chip:#232944; --shadow:none;
    --c1:#8E9AD6; --c2:#5CC4AE; --c3:#D9A257; --c4:#D98BBF; --c5:#9AA0BC; --c6:#A99AF0;
    --side-bg:#090C1A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0C1022; --surface:#171C30; --ink:#E8EAF3; --muted:#A3A9C4; --line:#2B3152; --line2:#3B4268;
    --accent:#8E9AD6; --accent-ink:#10142B; --col:#20253D; --high:#F08A80; --med:#D2A24E; --low:#6FBF86;
    --highbg:#3A1D21; --medbg:#2C2517; --lowbg:#16291F; --chip:#232944; --shadow:none;
    --c1:#8E9AD6; --c2:#5CC4AE; --c3:#D9A257; --c4:#D98BBF; --c5:#9AA0BC; --c6:#A99AF0;
    --side-bg:#090C1A; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;min-height:calc(100vh / var(--z))}
/* Default size: computers show the board at 80% (like browser zoom at 80%); phones stay at 100%.
   Full-height sizes divide by --z so they still fill the window. */
:root{--z:1}
@media (min-width:900px){:root{--z:.8}body{zoom:var(--z)}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* layout */
.app{display:flex;min-height:calc(100vh / var(--z))}
.main{flex:1 1 auto;min-width:0}
.side{width:248px;flex:0 0 248px;background:var(--side-bg);color:var(--side-ink);padding:18px 12px 20px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:calc(100vh / var(--z));align-self:flex-start;overflow-y:auto}
.brand{font:700 20px var(--head);letter-spacing:-.01em;padding:4px 10px 14px}
.sl{font-size:12px;color:var(--side-mute);padding:6px 10px;font-weight:600}
.proj{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:8px;padding:8px 10px;color:inherit;text-align:left}
.proj:hover{background:var(--side-hi)}
.proj.on{background:var(--side-hi);box-shadow:inset 3px 0 0 #9DB0FF}
.proj.add{color:var(--side-mute);margin-top:4px;gap:8px}
.pi{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--surface);flex:0 0 auto}
.pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sfoot{margin-top:auto;padding-top:12px}
.me{padding:12px 10px 0}
.me label{color:var(--side-mute);margin:0 0 4px}
.me input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:8px 10px;color:var(--side-ink)}
.scrim{display:none}
@media (max-width:899px){
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:40;transform:translateX(-100%);padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));box-shadow:4px 0 24px rgba(0,0,0,.3)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,16,24,.5);z-index:35}
}
/* wide screens: the menu button shrinks the sidebar to an icon rail */
@media (min-width:900px){
  .app.side-hidden .side{width:64px;flex-basis:64px;padding-left:10px;padding-right:10px;overflow-x:hidden}
  .app.side-hidden .side .brand,.app.side-hidden .side .sl,.app.side-hidden .side .pn,.app.side-hidden .side .me{display:none}
  .app.side-hidden .side .proj{justify-content:center;padding:8px 0!important}
  .app.side-hidden .side .proj.add{padding:6px 0!important}
  .app.side-hidden .side #plist{display:flex;flex-direction:column;gap:4px}
}
@media (min-width:900px) and (prefers-reduced-motion:no-preference){.side{transition:width .18s,flex-basis .18s}}
@media (prefers-reduced-motion:no-preference){.side{transition:transform .2s}}

.top{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.top .crumb{flex:1;min-width:0}
.top small{display:block;font-size:12px;color:var(--muted)}
h1{font-family:var(--head);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;padding:0}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filters{padding:12px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.filters input,.fsel select,.ctrl select,.ctrl input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.fsel{display:flex;gap:8px;align-items:center}
.fsel select{flex:0 0 auto;max-width:180px}
.qbox{display:flex;align-items:center;gap:6px;width:220px;max-width:100%;border:1px solid var(--line2);border-radius:8px;background:var(--surface);padding:0 10px;color:var(--muted)}
.qbox:focus-within{border-color:var(--accent)}
.filters .qbox input{border:0!important;background:none;padding:7px 0;width:100%;outline:none;font-size:14px}
.fav{display:flex;align-items:center}
.favb{border:2px solid var(--bg);border-radius:50%;padding:0;background:none;margin-left:-6px;display:grid;place-items:center;position:relative}
.favb:first-child{margin-left:0}
.favb .who{width:26px;height:26px;font-size:10px;color:#fff}
.favb.none{width:30px;height:30px;background:var(--chip);color:var(--muted)}
.favb:hover{z-index:2;transform:translateY(-2px)}
.favb.on{border-color:var(--c1);z-index:3}
.fwrap{position:relative}
.fbtn{display:inline-flex;align-items:center;gap:6px}
.fbtn.on{border-color:var(--accent)}
.fpop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;width:230px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:8px 12px 12px;box-shadow:0 8px 24px rgba(16,22,46,.18)}
.fpop label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:8px 0 4px}
.fpop select{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:6px 8px}
.facc{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin:12px 0 4px;padding:6px 2px;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;text-align:left}
.facc .facn{font-weight:500;color:var(--c1)}
.fchecks{display:flex;flex-direction:column;gap:2px;max-height:200px;overflow:auto}
.fpop label.fcheck{display:flex;align-items:center;gap:8px;margin:0;padding:4px 2px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;border-radius:6px}
.fpop label.fcheck:hover{background:var(--chip)}
.fcheck input{width:16px;height:16px;accent-color:var(--c1);margin:0}
.fsp{flex:1}
.fright{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fright select{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:5px 8px;font-weight:600}
.fright .btn.on{border-color:var(--accent)}
.gwrap{position:relative}
.gpop{left:auto;right:0;width:200px;padding:6px}
.gopt{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px;font-size:14px;color:var(--ink)}
.gopt:hover{background:var(--chip)}
.gopt.on{background:color-mix(in srgb,var(--c1) 14%,var(--surface));color:var(--c1);font-weight:600}
.jl tr.grp td{background:var(--col);padding:0;border-right:0}
.jl tr.grp button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:8px 10px;font-weight:700;font-size:13px;color:var(--ink);text-align:left}
.jl tr.grp .chev{width:12px;color:var(--muted);font-size:12px}
.jl tr.grp:hover td{background:var(--col)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--high)}
.btn.small{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}

/* issue chips and icons */
.ti{width:18px;height:18px;border-radius:5px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:var(--surface);flex:0 0 auto}
.pr{display:inline-grid;place-items:center}
.ic{display:inline-block;vertical-align:middle;flex:0 0 auto}
.key{font-size:12px;color:var(--muted);font-weight:600}
.chip{font-size:12px;background:var(--chip);border-radius:6px;padding:1px 7px;color:var(--muted)}
.chip.over{background:var(--high);color:var(--surface)}
.echip{display:inline-block;max-width:100%;font-size:12px;border-radius:6px;padding:1px 8px;margin:0 0 6px;background:var(--chip);color:var(--ink);border-left:4px solid var(--ec,var(--c6));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;display:grid;place-items:center;flex:0 0 auto}
.who.none{background:var(--chip);color:var(--muted)}
.sbadge{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;white-space:nowrap}
.cat-todo{background:var(--chip);color:var(--muted)}
.cat-doing{background:var(--accent);color:var(--accent-ink)}
.cat-done{background:var(--low);color:var(--surface)}

/* board */
.board{scrollbar-width:none}
.board::-webkit-scrollbar{display:none}
.bmini{position:fixed;right:20px;bottom:20px;z-index:25;padding:4px;box-sizing:content-box;background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:0 6px 20px rgba(16,22,46,.18);cursor:pointer;touch-action:none;user-select:none}
.bmini[hidden]{display:none}
.bmcols{position:relative;width:100%;height:100%}
.bmcols span{position:absolute;top:0;border-radius:2px;background:var(--line2)}
.bmview{position:absolute;top:2px;bottom:2px;border:2px solid var(--c1);border-radius:4px;box-sizing:border-box;pointer-events:none}
@media (hover:none),(max-width:640px){.bmini{display:none}}
.board{display:flex;gap:12px;overflow-x:auto;padding:12px 16px 28px;scroll-snap-type:x proximity;align-items:flex-start}
@media (min-width:641px){.board{scroll-snap-type:none}}   /* snapping only helps swiping on a phone */
.col{flex:0 0 min(84vw,290px);background:var(--col);border-radius:12px;padding:10px;scroll-snap-align:start}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col h2{display:flex;justify-content:space-between;align-items:center;gap:6px;font:600 15px var(--head);margin:2px 4px 10px}
.col h2 .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* collapse / expand a column (remembered per browser, per space) */
.colbtn{display:grid;place-items:center;width:26px;height:26px;padding:0;border:0;border-radius:6px;background:none;color:var(--muted);opacity:0;transition:opacity .12s;flex:0 0 auto}
.colbtn:hover{background:var(--chip);color:var(--ink)}
.col:hover .colbtn,.colbtn:focus-visible,.colbtn.on,.colbtn[aria-expanded="true"]{opacity:1}
.colbtn.on{color:var(--c1)}
.csort{position:relative;display:flex}
.cspop{left:auto;right:0;width:220px;padding:6px;text-transform:none;letter-spacing:0;font-weight:400}
@media (hover:none){.colbtn{opacity:1}}
.col.folded{flex:0 0 46px;padding:12px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:8px}
.col.folded .vn{writing-mode:vertical-rl;white-space:nowrap;font:800 13px var(--head);letter-spacing:.07em;text-transform:uppercase}
.col.folded .count{font-size:13px;color:var(--muted)}
.count{font:500 12px var(--body);color:var(--muted);background:var(--chip);border-radius:99px;padding:1px 9px}
.cards{display:flex;flex-direction:column;gap:8px;min-height:24px}
.card{background:var(--surface);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow);cursor:grab}
.card.dragging{opacity:.4}
.ck{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.ck .pr{margin-left:auto}
.card .title{display:block;width:100%;text-align:left;background:none;border:0;padding:2px 0 8px;font-weight:500;font-size:15px}
.card{cursor:pointer}
.card:hover{background:color-mix(in srgb,var(--ink) 3%,var(--surface))}
.ctitle{font-size:15px;font-weight:500;line-height:1.35;overflow-wrap:anywhere;margin-bottom:6px}
.cdue{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);margin-bottom:8px}
.cdue .odc.soon{color:var(--med)}
.cdue .odc.late{color:var(--high)}
.cdue.over{color:var(--high)}
.cfoot{display:flex;align-items:center;gap:6px}
.cfoot .sp{flex:1}
.cfoot .key{font-size:13px}
.cpick{position:relative;display:grid;place-items:center;min-width:24px;height:24px;border-radius:6px}
.cpick:hover{background:var(--chip)}
.cpick select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.cpick .who{width:24px;height:24px;font-size:10px;color:#fff}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta .who{margin-left:auto}
.mv{display:flex;gap:6px;margin-top:8px}
.mv button{flex:1;background:var(--chip);border:0;border-radius:6px;padding:5px 0;font-size:13px;color:var(--muted)}
.mv button:disabled{opacity:.35;cursor:default}
.add{width:100%;margin-top:8px;background:none;border:1px dashed var(--line);border-radius:8px;padding:8px;color:var(--muted)}
/* column "+" (create bid): a plain outlined bar; an empty column is just its header and this */
.col .add{border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:20px;font-weight:400;line-height:1;padding:5px 8px}
.col .add:hover{border-color:var(--accent)}
.cards:empty{display:none}
.cards:empty+.add{margin-top:0}
.empty{font-size:13px;color:var(--muted);padding:6px 4px}

/* list */
.tablewrap{margin:12px 16px 28px;overflow-x:auto;background:var(--surface);border-radius:12px;box-shadow:var(--shadow)}
table.list{border-collapse:collapse;width:100%;min-width:680px}
table.list th{text-align:left;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding:0}
table.list th button{background:none;border:0;padding:10px 12px;font-weight:600;color:inherit;width:100%;text-align:left}
.thc{display:flex;align-items:center}
.thc button{flex:1}
.grip{cursor:grab;color:var(--muted);padding:10px 0 10px 10px;font-size:12px;user-select:none;letter-spacing:-2px}
table.list th.th-over{box-shadow:inset 3px 0 0 var(--accent)}
.lbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 16px 0}
.lbar+.tablewrap,.lbar+.lbar+.tablewrap{margin-top:12px}
table.list td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
table.list tr:last-child td{border-bottom:0}
.kc{display:flex;align-items:center;gap:6px;white-space:nowrap}
.lt{background:none;border:0;padding:0;text-align:left;font-weight:500;font-size:14px}
table.list select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:13px}
/* Jira-style list */
.tablewrap.jl{border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:none}
.jl .tscroll{overflow:auto;max-height:calc(100vh / var(--z) - 230px)}
.jl table.list{min-width:1180px}
.jl table.list th{position:sticky;top:0;z-index:1;background:var(--surface);font-size:12px;font-weight:700;white-space:nowrap;border-right:1px solid var(--line)}
.jl table.list th button{padding:9px 10px}
.jl table.list td{padding:6px 10px;font-size:14px;white-space:nowrap;border-right:1px solid var(--line)}
.jl table.list td.led{cursor:pointer}
.jl table.list td.led:hover{background:var(--chip)}
.jl table.list td.ledon{padding:3px 6px;background:var(--surface)}
.lin{min-width:130px;max-width:100%;font:inherit;font-size:14px;padding:4px 6px;border:1px solid var(--c1);border-radius:6px;background:var(--bg);color:var(--ink)}
.lin2{display:flex;gap:4px}
.lin2 .lin{min-width:0}
.jl table.list td.ledon .lin[data-lf=title]{min-width:260px}
.lpen{display:grid;place-items:center;flex:none;width:24px;height:24px;margin-left:2px;border:0;border-radius:5px;background:none;color:var(--muted);opacity:0;cursor:pointer}
.lpen:hover{background:var(--chip);color:var(--ink)}
tr:hover .lpen,.lpen:focus-visible{opacity:1}
@media (hover:none){.lpen{opacity:1}}
.jl table.list td.rx,.jl table.list th.th-x{border-right:0;width:44px;text-align:center}
.jl table.list tbody tr:hover td{background:var(--col)}
.jl td.wk{max-width:440px;overflow:hidden}
.jl td.wk .kc{min-width:0}
.jl .lkey{background:none;border:0;padding:0;color:var(--c1);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:2px;flex:0 0 auto}
.jl .lkey.done{text-decoration:line-through}
.jl .lt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-weight:400}
.jl .tr{overflow:hidden;text-overflow:ellipsis;max-width:170px}
.jl .who{width:22px;height:22px;font-size:10px;color:#fff}
.jl .none{color:var(--muted)}
.jl td.over{color:var(--high);font-weight:600}
.jl td.num{text-align:right;font-variant-numeric:tabular-nums}
.jl select.lz{font-size:12px;font-weight:700;border-radius:4px;padding:1px 4px;border:1px solid transparent;cursor:pointer}
.jl select.lz.cat-todo{background:var(--chip);color:var(--muted);border-color:var(--line2)}
.jl select.lz.cat-doing{background:var(--medbg);color:var(--med);border-color:var(--med)}
.jl select.lz.cat-done{background:var(--lowbg);color:var(--low);border-color:var(--low)}
.jl .dots{background:none;border:0;border-radius:6px;padding:2px 6px;font-size:16px;font-weight:700;color:var(--muted);letter-spacing:-1px}
.jl .dots:hover{background:var(--chip);color:var(--ink)}
.jl .colsi{width:28px;height:28px;margin:0 auto}
.jl th.th-rh,.jl td.rh{width:22px;min-width:22px;padding:0 0 0 4px;border-right:0}
.jl .rgrip{display:grid;place-items:center;width:18px;height:26px;border-radius:4px;color:var(--muted);cursor:grab;opacity:0}
.jl tr:hover .rgrip,.jl .rgrip:focus-visible{opacity:1}
.jl .rgrip:hover{background:var(--chip);color:var(--ink)}
@media (hover:none){.jl .rgrip{opacity:1}}
.jl tr.dragging td{opacity:.45}
.jl tr.row-before td{box-shadow:inset 0 2px 0 var(--c1)}
.jl tr.row-after td{box-shadow:inset 0 -2px 0 var(--c1)}
.lfoot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.lcreate{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:none;border:0;padding:4px 6px;border-radius:6px;font-weight:600;justify-self:start}

.day{min-height:88px;padding:4px;background:var(--surface);cursor:pointer;min-width:0}

.day.sel{outline:2px solid var(--accent);outline-offset:-2px}

.cc{display:flex;align-items:center;gap:6px;width:calc(100% - 8px);height:24px;margin:4px 4px 0;text-align:left;font-size:13px;border:0;border-left:3px solid var(--pc,var(--c5));border-radius:4px;background:var(--chip);padding:0 6px 0 5px;min-width:0;cursor:pointer;color:var(--ink)}

.cc .ct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;font-weight:500}
.cc .cx{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.cc .od{display:block;color:var(--high)}
.cc.fin .ct{text-decoration:line-through;opacity:.55}
.more{display:block;background:none;border:0;font-size:13px;font-weight:500;color:var(--ink);margin:4px 0 0;padding:2px 8px;text-align:left}
.day{padding:0 0 6px;min-height:92px}
.day.out{background:var(--surface)}
.day.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.dow{background:var(--surface);color:var(--ink);font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:10px 0}
.dn{display:flex;justify-content:center;width:auto;height:auto;border-radius:0;background:none;padding:6px 0 2px;font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase}
.dn .dnn{min-width:22px;height:22px;padding:0 6px;border-radius:11px;display:grid;place-items:center}
.day.today .dn{background:none;color:var(--ink)}
.day.today .dnn{background:var(--accent);color:var(--accent-ink);font-weight:600}
.day.out .dn{opacity:.5}
.calscroll{margin:0 16px;overflow-x:auto}
.calscroll .cal{margin:0}
.calfoot{grid-column:1/-1;background:var(--surface);text-align:center;padding:12px;font-size:13px;color:var(--muted)}
.dwk{display:none}
.cal.week .day{min-height:220px}
.calwrap{display:block}
.unsch{margin:0 16px 28px}
.unrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);cursor:grab}
.unrow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:900px){
  .calwrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;align-items:start}

}
.dots{display:none;justify-content:center;align-items:center;gap:3px;flex-wrap:wrap;padding:2px 4px 0}
.dots i{width:7px;height:7px;border-radius:50%;display:block}

@media (max-width:640px){

  .cal-head .seg{margin-left:auto}
  .cal:not(.week) .day{min-height:58px;padding:0 0 4px}
  .cal:not(.week) .cc,.cal:not(.week) .more{display:none}
  .cal:not(.week) .dots{display:flex}
  .cal:not(.week) .dow{padding:8px 0;font-size:11px;letter-spacing:.02em}
  .cal:not(.week) .dn .dnn{min-width:24px;padding:0 4px}
  .cal:not(.week) .day.sel{outline:0}
  .cal:not(.week) .day.sel .dnn{box-shadow:0 0 0 2px var(--accent)}
  .calfoot{display:none}
  .cal.week{grid-template-columns:minmax(0,1fr)}

  .cal.week .day{min-height:0}
  .cal.week .dwk{display:inline}
  .cal.week .dn{justify-content:flex-start;padding-left:10px}
  .daypanel{margin:12px 8px 24px}
  .unsch{margin:0 8px 28px}
}
.note{margin:10px 16px 0;font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.daypanel{margin:12px 16px 28px}

.jnav{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:8px;background:var(--surface)}

.jnav button:hover{color:var(--ink)}
/* lines are borders on each box (not grid gaps), so none vanish at the 80% page scale */
.jcal{margin:12px 16px 28px;display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}

.jc .ti{width:16px;height:16px;font-size:10px;flex:0 0 auto}

.jc .jt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.jday .more{padding:4px 2px 0}
/* quick create */
.qc{background:var(--surface);border:2px solid var(--c1);border-radius:8px}

.qcb .sp{flex:1}
.qctype,.qcwho,.qcdue{position:relative;display:inline-flex;align-items:center;gap:2px;height:26px;padding:0 4px;border-radius:6px;color:var(--muted)}

.qci{display:grid;place-items:center;background:none;border:0;padding:0;color:var(--muted);width:22px;height:22px}
.qcdue .qci{width:auto}
.qcd{font-size:12px;font-weight:600;color:var(--ink);padding:0 2px}
.qcwho .who{width:22px;height:22px;font-size:9px;color:#fff}
.qcgo{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line2);background:var(--chip);color:var(--ink);border-radius:6px;padding:3px 10px;font-weight:600;font-size:13px}
.qcgo.ic{padding:2px 8px;font-size:15px}
.qcgo:hover{border-color:var(--c1)}
.qcrow{display:flex;align-items:center;gap:8px;margin:0;border-radius:0 0 8px 8px;padding:6px 10px}
.qcrow input[data-qct]{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14px;padding:6px 4px;color:var(--ink)}
.jday{position:relative}
.jpop{position:fixed;z-index:50;width:280px;max-height:calc(70vh / var(--z));overflow:auto;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:10px 10px 12px;box-shadow:0 8px 24px rgba(16,22,46,.18)}
.jph{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px}
.jph b{font-size:14px}

.unsch{margin:12px 16px 0}

.daypanel h3,.panel h3{font:600 16px var(--head);margin:0 0 10px}

/* epics */
.sec{font:700 20px var(--head);margin:0}

/* reports + settings */
.rep{padding:12px 16px 32px;display:grid;gap:14px;max-width:1000px}

/* ---- Bid Scout theme ---- */
body{font-size:16px}
h1{font-weight:800;font-size:24px;letter-spacing:-.01em}
.brand{font-weight:800}

.panel h3,.acth b{font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.stat b{font-weight:800}
.btn{border:1px solid var(--line2);border-radius:8px;font-weight:600}
.btn.primary{border-color:var(--accent)}
.icon{border:1.5px solid var(--line2);border-radius:10px}
.filters input,.fsel select,.ctrl select,.ctrl input,.sheet input,.sheet select,.sheet textarea,.srow input,.srow select,.qa input,table.list select{border:1px solid var(--line2);border-radius:8px}
/* view switcher: icon + name; the selected view is highlighted and underlined (like Jira) */
.tabs{gap:4px;padding:6px 12px 0;border-bottom:1px solid var(--line);align-items:flex-end}
.tab{display:inline-flex;align-items:center;gap:6px;border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 10px;margin:0 0 -1px;font-size:14px;font-weight:500;color:var(--muted);background:none}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--c1);border-bottom-color:var(--c1);font-weight:600}
.tab svg{flex:0 0 auto}
.chip{border:1.5px solid transparent;border-radius:99px;padding:1px 9px}
.chip.over{background:var(--highbg);color:var(--high);border-color:var(--high)}
.sbadge{border:1.5px solid transparent;border-radius:99px;padding:2px 10px}
.cat-todo{background:var(--chip);color:var(--muted);border-color:var(--line2)}
.cat-doing{background:var(--medbg);color:var(--med);border-color:var(--med)}
.cat-done{background:var(--lowbg);color:var(--low);border-color:var(--low)}
.linkbtn{color:var(--ink);font-weight:600}
.proj.on{box-shadow:inset 3px 0 0 #9AA7E8}
@media (max-width:640px){#theme .tl{display:none}}
#theme{display:inline-flex;align-items:center;gap:4px}
#me{display:inline-flex;align-items:center;gap:6px}

@media (max-width:640px){#me .tl{display:none}}
.melist{display:grid;gap:6px;margin:12px 0 4px;max-height:50vh;overflow:auto}
.melist button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px;text-align:left;cursor:pointer}
.melist button:hover,.melist button[aria-pressed="true"]{border-color:var(--c1)}
#theme>span{display:inline-flex}

/* ---- divisions, overview, team ---- */
.dtabs{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;align-items:flex-end}
.dtab{background:var(--col);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:8px 16px;font-weight:600;color:var(--muted);white-space:nowrap}
.dtab.on{background:var(--surface);color:var(--ink);border-color:var(--accent);font-weight:700}
.dtab.new{background:none;border:1px dashed var(--line2);border-bottom:0;padding:8px 14px}
.dtabs+.tabs{padding-top:0;border-top:2px solid var(--accent)}
img.who{object-fit:cover;background:var(--chip)}
.srow .who{width:32px;height:32px;font-size:12px}
.sbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--chip)}
.sbar i{display:block;height:100%}
.kpis{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tpl{border:1px solid var(--line);border-radius:10px;padding:4px 10px 8px;margin-top:10px}
#whoami{font-size:14px;overflow-wrap:anywhere}
.me .sl{padding-left:0}

<body>
<div class="app">
  <aside class="side" id="side" aria-label="Spaces">

    <div id="plist"></div>
    <div id="sfoot"></div>

  <div class="main">

      <button class="icon" id="menu" data-menu aria-label="Open spaces"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4.5h14M2 9h14M2 13.5h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
      <div class="crumb"><small id="pkey"></small><h1 id="ptitle"></h1></div>
      <button class="btn small" id="me" type="button" data-me hidden></button>
      <button class="btn small" id="theme" type="button"></button>
    </header>
    <nav class="dtabs" id="dtabs" aria-label="Divisions"></nav>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>

      <div class="fsel" id="fsel"></div>
      <span class="fsp"></span>
      <div class="fright" id="fright"></div>
    </div>
    <main id="view"></main>
    <div class="bmini" id="bmini" hidden aria-hidden="true"><div class="bmcols"></div><div class="bmview"></div></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<!-- day -->
<div class="overlay" id="ov-settings" role="dialog" aria-modal="true" aria-labelledby="setTitle">

    <div class="sethead"><h3 id="setTitle">Settings</h3><button class="icon" id="setNewTpl" data-newtpl title="New workflow template" aria-label="New workflow template"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>

<!-- issue -->

<!-- create issue -->

      <div><label for="c-type">Type</label><select id="c-type"></select></div>
      <div><label for="c-status">Status</label><select id="c-status"></select></div>
    </div>

    <input id="c-title" maxlength="140">
    <label for="c-desc">Description</label>

    <div class="actions" id="autoActs"></div>

<div class="overlay" id="ov-tpl" role="dialog" aria-modal="true" aria-labelledby="tplTitle">

    <div class="actions" id="tplActs"></div>
  </div>
</div>

    <div class="actions" id="tmActs"></div>
  </div>
</div>

      do{

        Object.keys(m).forEach(function(p){var c=canon(m[p]);if(base[p]!==c)ops.push({p:p,c:c})});
        Object.keys(base).forEach(function(p){if(!(p in m)&&p!=="org/config")ops.push({p:p,del:true})});
        for(var i=0;i<ops.length;i++){
          var o=ops[i];
          try{
            if(o.del){await deleteDoc(o.p);delete base[o.p];rawDel(o.p)}
            else{var data=JSON.parse(o.c);await writeDoc(o.p,data);base[o.p]=o.c;rawPut(o.p,data)}

  /* ---------- board ---------- */

  var CSORTS=[["due","Due date: soonest first"],["due-desc","Due date: latest first"],["priority","Priority: highest first"],

  function colSort(p,sid){var m=((state.colSort||{})[p.id]||{})[sid];return CSORTS.some(function(x){return x[0]===m})?m:"due"}
  function colCmp(mode){
    var k=mode==="due-desc"?"due":mode,dir=mode==="due-desc"||mode==="updated"||mode==="created"?-1:1;

      if(k==="due"&&(!a.due||!b.due)&&a.due!==b.due)return a.due?-1:1;

  /* ---------- list ---------- */
  function sortVal(is,k){
    var p=proj();
    if(k.indexOf("cf:")===0){
      var sf=spaceFields(p).filter(function(x){return "cf:"+x.id===k})[0],sv=sf?(is.fields||{})[sf.id]:"";
      if(!sv)return sf&&(sf.type==="money"||sf.type==="number")?Infinity:"~";
      if(sf.type==="money"||sf.type==="number")return Number(sv);
      return cfShow(sf,sv).toLowerCase();
    }
    if(k==="rank")return rk(is);
    if(k==="num"||k==="title")return k==="num"?is.num:(is.title||"").toLowerCase();
    if(k==="status")return p.statuses.findIndex(function(s){return s.id===is.status});
    if(k==="priority")return PRI.indexOf(is.priority);
    if(k==="due")return (is.due||"9999")+(is.dueTime||"99:99");
    if(k==="assignee")return (is.assignee?nameOf(is.assignee):"~").toLowerCase();
    if(k==="resolution")return isDone(is)?0:1;
    if(k==="updated")return is.updated||0;
    return String(is[k]||"~").toLowerCase();
  }
  function cmp(a,b){var x=sortVal(a,ui.sort),y=sortVal(b,ui.sort);return (x<y?-1:x>y?1:0)*ui.dir}

  function lcolName(k){
    if(k.indexOf("cf:")===0){var fd=spaceFields(proj()).filter(function(x){return "cf:"+x.id===k})[0];return fd?fd.name:""}
    return LCOLS[k];
  }
  function listDef(){return LDEF.concat(spaceFields(proj()).map(function(fd){return "cf:"+fd.id}))}
  function listOrder(){
    var def=listDef(),o=(state.listCols||[]).filter(function(k){return def.indexOf(k)>-1});
    def.forEach(function(k){if(o.indexOf(k)<0)o.push(k)});
    return o;
  }
  function moveCol(from,to){
    if(from===to)return;
    var o=listOrder(),i=o.indexOf(from),j=o.indexOf(to);

  }

    if(k==="created")return '<td>'+fmtDay(is.created)+'</td>';

  // List row dragged before/after another: give it a rank between its new neighbors
  function moveRow(id,targetId,before){
    var is=byId(id);if(!is||id===targetId)return render();
    var order=proj().issues.filter(visible).sort(cmp).filter(function(x){return x.id!==id});
    var j=order.findIndex(function(x){return x.id===targetId});if(j<0)return render();
    if(!before)j++;
    var prev=order[j-1],next=order[j];
    is.rank=prev&&next?(rk(prev)+rk(next))/2:prev?rk(prev)+1000:next?rk(next)-1000:1000;
    proj().issues.sort(function(a,b){return rk(a)-rk(b)});
    save();render();
  }
  /* ---------- List grouping (Group button in the toolbar; remembered per browser) ---------- */
  function groupOpts(p){
    var o=[["","None"],["status","Status"],["assignee","Assignee"],["reporter","Reporter"],["priority","Priority"],["type","Type"]];
    spaceFields(p).forEach(function(fd){if(fd.type==="person"||fd.type==="team")o.push(["cf:"+fd.id,fd.name])});

  function curGroup(p){var g=state.listGroup||"";return groupOpts(p).some(function(x){return x[0]===g})?g:""}

    if(g==="status"){var st=stat(p,is.status);return [p.statuses.indexOf(st),st.name]}

    if(g==="type")return [TYPES.indexOf(is.type),is.type];
    if(g==="assignee"||g==="reporter"){var pid=is[g];return pid?[nameOf(pid).toLowerCase(),nameOf(pid)]:["~",g==="assignee"?"Unassigned":"None"]}
    if(g.indexOf("cf:")===0){
      var fd=spaceFields(p).filter(function(x){return "cf:"+x.id===g})[0],v=fd?(is.fields||{})[fd.id]:"";
      return v?[cfShow(fd,v).toLowerCase(),cfShow(fd,v)]:["~","None"];

  function calHTML(){

  // every field can group, filter, or (amounts/numbers) be totalled
  function rFields(){return spaceFields(proj())}

  function rField(g){return g&&g.indexOf("cf:")===0?rFields().filter(function(x){return "cf:"+x.id===g})[0]:null}
  function groupChoices(){
    var o=GROUPS.slice(0,4).concat([["reporter","Reporter"]],GROUPS.slice(4));
    rFields().forEach(function(fd){if(fd.type!=="money"&&fd.type!=="number")o.push(["cf:"+fd.id,fd.type==="date"?fd.name+" (month)":fd.name])});

  }
  function isTimeG(g){var fd=rField(g);return !!TIME[g]||!!(fd&&fd.type==="date")}
  function isMonthG(g){var fd=rField(g);return g==="due"||!!(fd&&fd.type==="date")}
  // what the chart counts: bids, or the total of an amount/number field
  function measureField(){var m=state.rcfg.measure||"";return m?rFields().filter(function(x){return x.id===m&&(x.type==="money"||x.type==="number")})[0]||null:null}
  function mval(items){var fd=measureField();if(!fd)return items.length;return items.reduce(function(a,t){var v=Number((t.fields||{})[fd.id]);return a+(isFinite(v)?v:0)},0)}
  function fmtM(n){var fd=measureField();if(!fd)return String(n);return fd.type==="money"?"$"+Math.round(n).toLocaleString():n.toLocaleString(undefined,{maximumFractionDigits:2})}
  function scoped(){
    var c=state.rcfg,cf=c.cf||{},F=rFields();
    return proj().issues.filter(function(t){
      if(c.rep&&(t.reporter||"__none")!==c.rep)return false;
      for(var i=0;i<F.length;i++){
        var fd=F[i],want=cf[fd.id],v=(t.fields||{})[fd.id]||"";if(!want)continue;
        if(fd.type==="person"||fd.type==="team"){if((v||"__none")!==want)return false}
        else if(fd.type==="text"){if(String(v).toLowerCase().indexOf(want.toLowerCase())<0)return false}
        else if(want==="set"?!v:!!v)return false;
      }
      if(c.scope==="open"&&isDone(t))return false;
      if(c.scope==="done"&&!isDone(t))return false;
      if(c.scope==="overdue"&&!overdue(t))return false;
      if(c.type&&t.type!==c.type)return false;
      if(c.pri&&t.priority!==c.pri)return false;
      if(c.who&&(t.assignee||"__none")!==c.who)return false;
      if(c.label&&t.labels.indexOf(c.label)<0)return false;

    });
  }
  function groupKeys(t,g){
    if(g==="status")return [t.status];
    if(g==="type")return [t.type];
    if(g==="priority")return [t.priority];
    if(g==="assignee")return [t.assignee||"__none"];
    if(g==="reporter")return [t.reporter||"__none"];
    if(g.indexOf("cf:")===0){var gf=rField(g),gv=gf?(t.fields||{})[gf.id]:"";if(!gv)return ["__none"];return [gf.type==="date"?gv.slice(0,7):gv]}

    if(g==="label")return t.labels.length?t.labels:["No label"];
    if(g==="due")return [t.due?t.due.slice(0,7):"No due date"];
    if(g==="created")return [weekStart(t.created)];
    return t.doneAt?[weekStart(t.doneAt)]:["Not completed"];
  }
  function keyLabel(g,k){
    if(g==="assignee")return k==="__none"?"Unassigned":nameOf(k);
    if(g==="reporter")return k==="__none"?"None":nameOf(k);
    if(g.indexOf("cf:")===0){var kf=rField(g);if(k==="__none")return "No "+(kf?kf.name:"value");if(kf&&kf.type==="date")return monthLabel(k);return kf?cfShow(kf,k):k}

    if(g==="due"&&/^\d/.test(k))return monthLabel(k);

  function nextMonth(k){var p=k.split("-"),d=new Date(+p[0],+p[1],1);return d.getFullYear()+"-"+pad(d.getMonth()+1)}
  function buildGroups(list,g){
    var map={};
    list.forEach(function(t){groupKeys(t,g).forEach(function(k){(map[k]=map[k]||[]).push(t)})});
    var keys=Object.keys(map);
    if(g==="status")keys=proj().statuses.map(function(s){return s.id});
    else if(g==="priority")keys=PRI.slice();
    else if(g==="type")keys=TYPES.slice();
    else if(isTimeG(g)){
      var real=keys.filter(function(k){return /^\d/.test(k)}).sort(),extra=keys.filter(function(k){return !/^\d/.test(k)}),filled=[];
      if(real.length){var k=real[0],last=real[real.length-1],guard=0;while(k<=last&&guard++<240){filled.push(k);k=isMonthG(g)?nextMonth(k):addDays(k,7)}}
      keys=filled.concat(extra);
    }else keys.sort(function(a,b){return mval(map[b])-mval(map[a])||a.localeCompare(b)});
    return keys.map(function(k){return {key:k,label:keyLabel(g,k),items:map[k]||[]}});
  }

  function tplStatuses(id){
    ensureTplIds();
    var t=D.config.templates.filter(function(x){return x.id===id})[0];
    if(!t)return TPL_DEFAULT.map(function(x){return {id:uid("s"),name:x.name,cat:x.cat}});
    return t.statuses.map(function(x){return {id:uid("s"),name:x.name,cat:x.cat,tpl:t.id,tc:x.id}});
  }

  /* A space made from (or applied) an org template follows it: each of its columns carries
     tpl (template id) + tc (template column id), and editing the template updates every
     following space — renames, reorders, categories, added and removed columns. Editing a
     space's own columns stops it following (tpl set to ""). */
  function ensureTplIds(){
    var ch=false;
    D.config.templates.forEach(function(t){
      var used={};t.statuses.forEach(function(c){if(c.id)used[c.id]=1});
      t.statuses.forEach(function(c,i){if(!c.id){var k="c"+i;while(used[k])k+="x";c.id=k;used[k]=1;ch=true}});
    });
    return ch;
  }
  function followedTpl(sp){
    var st=sp.statuses;
    if(!st.length||!st[0].tpl)return null;
    if(st.some(function(c){return c.tpl!==st[0].tpl||!c.tc}))return null;
    return D.config.templates.filter(function(t){return t.id===st[0].tpl})[0]||null;
  }
  function unfollow(sp){sp.statuses.forEach(function(c){c.tpl="";delete c.tc})}
  // A space that never followed anything (e.g. the "Bid Scout inbox" made by the database)
  // starts following a template whose column names match its own, in order.
  function adoptTpl(sp){
    if(sp.statuses.some(function(c){return "tpl" in c}))return null;
    var names=sp.statuses.map(function(c){return c.name.toLowerCase()}).join("|");
    var t=D.config.templates.filter(function(t){return t.statuses.map(function(c){return c.name.toLowerCase()}).join("|")===names})[0];
    if(!t)return null;
    sp.statuses.forEach(function(c,i){c.tpl=t.id;c.tc=t.statuses[i].id});
    return t;
  }
  function syncSpaceToTpl(sp,t){
    var old=sp.statuses,byTc={},ids={};
    old.forEach(function(c){byTc[c.tc]=c;ids[c.id]=1});
    var next=t.statuses.map(function(c){
      var o=byTc[c.id],id=o?o.id:(ids[c.id]?uid("s"):c.id);
      return {id:id,name:c.name,cat:c.cat,tpl:t.id,tc:c.id};
    });
    if(canon(next)===canon(old))return false;
    sp.statuses=next;
    var keep={};next.forEach(function(c){keep[c.id]=c});
    sp.issues.forEach(function(is){
      if(keep[is.status]){applyStatus(sp,is,is.status);return}   // category may have changed
      // its column was removed from the template: move it to the nearest earlier column still there
      var oi=old.findIndex(function(c){return c.id===is.status}),to=null;
      for(var k=oi-1;k>=0&&!to;k--)if(keep[old[k].id])to=old[k].id;
      if(!to)to=next[0].id;
      logH(is,"Status",oi>-1?old[oi].name:"",keep[to].name);
      applyStatus(sp,is,to);
    });
    return true;
  }
  function syncTemplates(){
    var ch=ensureTplIds();
    D.spaces.forEach(function(sp){
      if(isArchived(sp.divisionId))return;
      var t=followedTpl(sp)||adoptTpl(sp);
      if(t&&syncSpaceToTpl(sp,t))ch=true;
    });
    return ch;
  }
  function applyTemplate(p,tpl){
    var old=p.statuses.slice();
    if(!tpl.statuses.length)return;
    p.statuses=tplStatuses(tpl.id);
    p.issues.forEach(function(is){
      var os=old.filter(function(x){return x.id===is.status})[0]||old[0];
      var nt=p.statuses.filter(function(x){return x.name.toLowerCase()===os.name.toLowerCase()})[0]||p.statuses.filter(function(x){return x.cat===os.cat})[0]||p.statuses[0];
      if(nt.name!==os.name)logH(is,"Status",os.name,nt.name);
      applyStatus(p,is,nt.id);
    });
  }

  function autoKey(name){
    var w=name.toUpperCase().replace(/[^A-Z0-9 ]/g,"").split(/\s+/).filter(Boolean);
    if(!w.length)return "";
    return (w.length>1?w.slice(0,4).map(function(x){return x[0]}).join(""):w[0].slice(0,4)).slice(0,5);
  }
  function openSpace(parentId){

    $("p-parent").innerHTML=opt("","None (top level)","")+spaceTree(d.id).map(function(n){return opt(n.sp.id,"\u00a0\u00a0".repeat(n.depth)+n.sp.name,parentId||"")}).join("");

  function updateMinimap(){

    if(!bd||bd.scrollWidth<=bd.clientWidth+4){mm.hidden=true;return}
    var sp=boardSpan(bd);if(!sp){mm.hidden=true;return}
    mm.hidden=false;
    var sc=MM_W/(sp.x1-sp.x0);
    mm.firstChild.innerHTML=Array.prototype.map.call(sp.cols,function(c){
      var r=c.getBoundingClientRect();
      return '<span style="left:'+((r.left-sp.ox-sp.x0)*sc).toFixed(1)+'px;width:'+Math.max(1.5,r.width*sc).toFixed(1)+'px;height:'+MM_H+'px"></span>';
    }).join("");
    mm.style.width=MM_W+"px";mm.style.height=MM_H+"px";
    var vx0=Math.max(sp.x0,bd.scrollLeft),vx1=Math.min(sp.x1,bd.scrollLeft+bd.clientWidth),v=mm.lastChild;
    v.style.left=(4+(vx0-sp.x0)*sc).toFixed(1)+"px";v.style.width=Math.max(6,(vx1-vx0)*sc).toFixed(1)+"px";
  }
  window.addEventListener("resize",updateMinimap);
  // A mouse wheel over the board scrolls it sideways (its scrollbar is hidden; the minimap shows where you are).
  // A column taller than the screen still scrolls the page down first; trackpad side-swipes work as usual.
  document.addEventListener("wheel",function(e){
    var bd=e.target.closest&&e.target.closest("#view .board");
    if(!bd||e.ctrlKey||e.shiftKey||Math.abs(e.deltaX)>=Math.abs(e.deltaY)||bd.scrollWidth<=bd.clientWidth+4)return;
    var col=e.target.closest(".col"),r=col&&col.getBoundingClientRect();
    if(e.deltaY>0&&r&&r.bottom>window.innerHeight+2)return;
    if(e.deltaY<0&&window.scrollY>0&&r&&r.top<0)return;
    var max=bd.scrollWidth-bd.clientWidth;
    if((e.deltaY<0&&bd.scrollLeft<=0)||(e.deltaY>0&&bd.scrollLeft>=max-1))return;
    e.preventDefault();
    bd.scrollLeft+=e.deltaMode===1?e.deltaY*40:e.deltaY;
  },{passive:false});
  document.addEventListener("scroll",function(e){if(e.target.classList&&e.target.classList.contains("board"))updateMinimap()},true);
  (function(){
    var mm=$("bmini"),drag=false;
    document.body.appendChild(mm);   // fixed to the window itself, not to a scrolling ancestor
    function go(e){
      var bd=document.querySelector("#view .board");if(!bd)return;
      var sp=boardSpan(bd);if(!sp)return;
      // the page may be zoomed: turn the pointer into the minimap's own pixels first
      var mr=mm.getBoundingClientRect(),zr=mr.width/mm.offsetWidth||1;
      var x=(e.clientX-mr.left)/zr-5,sc=MM_W/(sp.x1-sp.x0);
      bd.style.scrollSnapType="none";   // follow the pointer exactly, no snapping
      bd.scrollLeft=sp.x0+x/sc-bd.clientWidth/2;
    }
    mm.addEventListener("pointerdown",function(e){drag=true;mm.setPointerCapture(e.pointerId);go(e)});
    mm.addEventListener("pointermove",function(e){if(drag)go(e)});
    function end(){drag=false;var bd=document.querySelector("#view .board");if(bd)bd.style.scrollSnapType=""}
    mm.addEventListener("pointerup",end);mm.addEventListener("pointercancel",end);
  })();
  document.addEventListener("mousedown",function(e){
    if(ui.fmenu&&!(e.target.closest&&e.target.closest(".fmenu,[data-fmore]"))){ui.fmenu=false;renderAttach()}
    var mpk=e.target.closest&&e.target.closest("[data-mpick]");
    if(mpk){e.preventDefault();pickMention(mpk.getAttribute("data-mpick"));return}
    if(ui.mq&&e.target!==ui.mq.el)closeMention();
    if(ui.colSortOpen&&!e.target.closest(".csort")){ui.colSortOpen=null;var csp2=document.querySelector(".cspop");if(csp2)csp2.remove()}
    if(ui.gOpen&&!e.target.closest(".gwrap")){ui.gOpen=false;var gp=document.querySelector(".gpop");if(gp)gp.remove()}
    if(ui.fOpen&&!e.target.closest(".fwrap")){ui.fOpen=false;var fp=document.querySelector(".fpop");if(fp)fp.remove();var fb=document.querySelector("[data-fopen]");if(fb)fb.setAttribute("aria-expanded","false")}
    if(ui.calPop&&!e.target.closest(".jpop")&&!e.target.closest("[data-more]"))closeCalPop();
  });
  document.addEventListener("change",function(e){
    if(e.target.hasAttribute&&e.target.hasAttribute("data-attinput")){var fl=e.target.files;uploadFiles(fl,e.target.getAttribute("data-attinput"));e.target.value=""}
  });
  (function(){
    var box=$("ov-issue");
    box.addEventListener("dragover",function(e){
      var z=e.target.closest&&e.target.closest("[data-dropz]");
      if(z&&e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],"Files")>-1){e.preventDefault();z.classList.add("over")}
    });
    box.addEventListener("dragleave",function(e){var z=e.target.closest&&e.target.closest("[data-dropz]");if(z)z.classList.remove("over")});
    box.addEventListener("drop",function(e){
      var z=e.target.closest&&e.target.closest("[data-dropz]");
      if(z&&e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){e.preventDefault();z.classList.remove("over");uploadFiles(e.dataTransfer.files,z.getAttribute("data-dropz"))}
    });
  })();
  (function(){
    var box=$("ov-issue"),dragF=null;
    function clearF(){Array.prototype.forEach.call(box.querySelectorAll(".frow.fb,.frow.fa"),function(x){x.classList.remove("fb","fa")})}
    box.addEventListener("dragstart",function(e){
      var g=e.target.closest&&e.target.closest("[data-fdrag]");if(!g)return;
      dragF=g.getAttribute("data-fdrag");var row=g.closest(".frow");
      try{e.dataTransfer.setData("text/plain",dragF);e.dataTransfer.effectAllowed="move";if(row)e.dataTransfer.setDragImage(row,10,10)}catch(x){}
    });
    box.addEventListener("dragover",function(e){
      if(!dragF)return;var r=e.target.closest(".frow[data-fkey]");if(!r)return;
      e.preventDefault();clearF();
      var rc=r.getBoundingClientRect();r.classList.add(e.clientY<rc.top+rc.height/2?"fb":"fa");
    });
    box.addEventListener("drop",function(e){
      if(!dragF)return;var r=e.target.closest(".frow[data-fkey]"),from=dragF;dragF=null;
      if(!r){clearF();return}
      e.preventDefault();var before=r.classList.contains("fb");clearF();
      if(r.getAttribute("data-fkey")!==from)moveFieldRow(from,r.getAttribute("data-fkey"),before);
    });
    box.addEventListener("dragend",function(){dragF=null;clearF()});
  })();
  view.addEventListener("dragstart",function(e){
    var rg=e.target.closest&&e.target.closest("[data-rowdrag]");
    if(rg){ui.dragRow=rg.getAttribute("data-rowdrag");var rtr=rg.closest("tr");if(rtr)rtr.classList.add("dragging");
      try{e.dataTransfer.setData("text/plain",ui.dragRow);e.dataTransfer.effectAllowed="move";if(rtr)e.dataTransfer.setDragImage(rtr,12,12)}catch(x){}return}
    var th=e.target.closest("[data-lcol]");
    if(th){ui.dragCol=th.getAttribute("data-lcol");try{e.dataTransfer.setData("text/plain",ui.dragCol);e.dataTransfer.effectAllowed="move"}catch(x){}return}
    var c=e.target.closest(".card,[data-iid]");if(!c)return;
    ui.dragId=c.getAttribute("data-id")||c.getAttribute("data-iid");c.classList.add("dragging");
    try{e.dataTransfer.setData("text/plain",ui.dragId);e.dataTransfer.effectAllowed="move"}catch(x){}
  });
  view.addEventListener("dragend",function(){ui.dragId=null;ui.dragCol=null;ui.dragRow=null;render()});
  view.addEventListener("dragover",function(e){
    if(ui.dragRow){
      var otr=e.target.closest("tr[data-row]");if(!otr)return;
      e.preventDefault();
      var rr=otr.getBoundingClientRect(),up=e.clientY<rr.top+rr.height/2;
      Array.prototype.forEach.call(view.querySelectorAll(".row-before,.row-after"),function(x){x.classList.remove("row-before","row-after")});
      otr.classList.add(up?"row-before":"row-after");return;
    }
    var th=e.target.closest("[data-lcol]");
    if(th&&ui.dragCol){e.preventDefault();Array.prototype.forEach.call(view.querySelectorAll(".th-over"),function(x){x.classList.remove("th-over")});th.classList.add("th-over");return}
    var dy=e.target.closest("[data-day]");
    if(dy&&ui.dragId){e.preventDefault();Array.prototype.forEach.call(view.querySelectorAll("[data-day].drop"),function(x){x.classList.remove("drop")});dy.classList.add("drop");return}
    var col=e.target.closest(".col");if(!col||!ui.dragId)return;
    e.preventDefault();
    Array.prototype.forEach.call(view.querySelectorAll(".col.over"),function(x){x.classList.remove("over")});
    col.classList.add("over");
  });
  view.addEventListener("drop",function(e){
    if(ui.dragRow){
      var dtr=e.target.closest("tr[data-row]"),rid=ui.dragRow;ui.dragRow=null;
      if(!dtr){render();return}
      e.preventDefault();
      moveRow(rid,dtr.getAttribute("data-row"),dtr.classList.contains("row-before"));return;
    }
    var th=e.target.closest("[data-lcol]");
    if(th&&ui.dragCol){e.preventDefault();var from=ui.dragCol;ui.dragCol=null;moveCol(from,th.getAttribute("data-lcol"));return}
    var dy=e.target.closest("[data-day]");
    if(dy&&ui.dragId){e.preventDefault();var did0=ui.dragId;ui.dragId=null;var di=byId(did0);if(di)setField(di,"due",dy.getAttribute("data-day"));return}
    var col=e.target.closest(".col");if(!col||!ui.dragId)return;
    e.preventDefault();
    var over=e.target.closest(".card");
    var before=over&&over.getAttribute("data-id")!==ui.dragId?over.getAttribute("data-id"):null;
    var id=ui.dragId;ui.dragId=null;
    moveTo(id,col.getAttribute("data-col"),before);
  });

  var THEMES=["auto","light","dark"],TGL={auto:ic("auto",14),light:ic("sun",14),dark:ic("moon",14)},TLBL={auto:"Auto",light:"Light",dark:"Dark"};
  function applyTheme(){
    var t=state.theme||"auto",r=document.documentElement;
    if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);
    $("theme").innerHTML='<span aria-hidden="true">'+TGL[t]+'</span><span class="tl"> '+TLBL[t]+'</span>';
    $("theme").setAttribute("aria-label","Theme: "+TLBL[t]+". Tap to change.");
  }
  $("theme").addEventListener("click",function(){
    var i=THEMES.indexOf(state.theme||"auto");
    state.theme=THEMES[(i+1)%THEMES.length];save();applyTheme();
    try{localStorage.setItem("bidscout_theme",state.theme)}catch(e){}
  });
  $("c-save").addEventListener("click",submitCreate);
  $("p-save").addEventListener("click",submitSpace);

  state=loadPrefs();
  ORG=true;CANWRITE=true;ME="Someone";
  // Same switch as Bid Scout (served from the same site, so same localStorage).
  try{var bt=localStorage.getItem("bidscout_theme");if(THEMES.indexOf(bt)>=0)state.theme=bt}catch(e){}
  applyTheme();applySide();
  render();
  (function boot(){
    if(!window.supabase||!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY){
      DENIED="The app isn’t configured. Set SUPABASE_URL and SUPABASE_ANON_KEY (see the README).";render();return;
    }
    try{sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}})}
    catch(e){onLoadErr(e);return}
    if(!state.div)state.view="board";
    loadAll().then(listen).catch(onLoadErr);
  })();
})();
