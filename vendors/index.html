<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171d33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vendors">
<title>Vendors</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png?v=2">
<script>try{var t=localStorage.getItem('bidscout_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<script src="config.js"></script>
<style>
:root{--bg:#f1f3f6;--s:#ffffff;--s2:#eef0f5;--mast:#202c54;--pop:#ffffff;--t:#161d2e;--m:#586071;--b:#d3d7e0;--bs:#bcc1cf;--a:#202c54;--ah:#2e3d70;--as:#e5e7f1;--ast:#26315c;--ac:#ffffff;--d:#b83f30;--ok:#1f7a43;--w:#b26b00;--mt:#ffffff;--mm:rgba(255,255,255,.74);--mpri:#ffffff;--mprit:#202c54;--mark:#dfe4f6;--markt:#161d2e;--ph:#8a92a3;--unbg:#f4ecd9;--warnbg:#fbf3e4;--warnt:#6e4a10;--okbd:#9fd0b3;--okbg:#e3f1e8;--okt:#185c33;--errbd:#e3b2aa;--errbg:#f6e9e7;--errt:#8a2c20;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1120;--s:#161b2c;--s2:#1f2539;--mast:#171d33;--pop:#171d33;--t:#e6e9f1;--m:#99a1b3;--b:#2b3247;--bs:#3c4559;--a:#93a3d6;--ah:#adb9e2;--as:#232b47;--ast:#bcc6e8;--ac:#12162b;--d:#e0705f;--ok:#57bb80;--w:#d49b52;--mt:#edf0f8;--mm:rgba(237,240,248,.66);--mpri:#93a3d6;--mprit:#12162b;--mark:#3a4678;--markt:#fff;--ph:#5f6779;--unbg:#3a2f1e;--warnbg:#2c2418;--warnt:#f0cfa0;--okbd:#2f6a49;--okbg:#16281f;--okt:#a8e0c0;--errbd:#7a3b33;--errbg:#2a1715;--errt:#f0b4aa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1120;--s:#161b2c;--s2:#1f2539;--mast:#171d33;--pop:#171d33;--t:#e6e9f1;--m:#99a1b3;--b:#2b3247;--bs:#3c4559;--a:#93a3d6;--ah:#adb9e2;--as:#232b47;--ast:#bcc6e8;--ac:#12162b;--d:#e0705f;--ok:#57bb80;--w:#d49b52;--mt:#edf0f8;--mm:rgba(237,240,248,.66);--mpri:#93a3d6;--mprit:#12162b;--mark:#3a4678;--markt:#fff;--ph:#5f6779;--unbg:#3a2f1e;--warnbg:#2c2418;--warnt:#f0cfa0;--okbd:#2f6a49;--okbg:#16281f;--okt:#a8e0c0;--errbd:#7a3b33;--errbg:#2a1715;--errt:#f0b4aa;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t);transition:background-color .15s;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
a{color:inherit}
svg{flex:none}
mark{background:var(--mark);color:var(--markt);border-radius:3px;padding:0 1px}
.app{min-height:100vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
/* the top bar, as Bid Scout's: a floating card — the name, the division pills, then round icon buttons */
.mast{position:relative;z-index:30;margin:calc(12px + env(safe-area-inset-top)) 16px 0;background:var(--mast);border:1px solid rgba(255,255,255,.07);border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.mast-in{min-height:60px;padding:8px 10px 8px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.mast h1{color:var(--mt);font-size:17px;margin:0;font-weight:800;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:default}
.dtabs{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.dtab{height:30px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:var(--mm);font-size:13px;font-weight:600}
.dtab:hover{background:rgba(255,255,255,.15);color:var(--mt)}
.dtab.on{background:#fff;color:#202c54;border-color:#fff}
.mright{margin-left:auto;display:flex;align-items:center;gap:8px}
.cbtn{width:38px;height:38px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--mm);display:inline-grid;place-items:center;position:relative;flex:none}
.cbtn:hover{color:var(--mt);background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.34)}
.cbtn.pri{background:var(--mpri);border-color:var(--mpri);color:var(--mprit)}
.cbtn .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:#fff}
.find{display:flex;align-items:center;gap:6px}
.msearch{display:none;align-items:center;gap:8px;width:340px;height:38px;background:var(--s);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:0 14px}
.msearch:focus-within{border-color:var(--a)}
.msearch input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:16px}
.find.open .msearch{display:flex}
@media(max-width:699px){
 .mast{margin:calc(8px + env(safe-area-inset-top)) 10px 0}
 .mast-in{padding:8px 8px 8px 10px;gap:8px;flex-wrap:nowrap}
 .mast h1{font-size:16px}
 .mright{gap:6px}
 .cbtn{width:36px;height:36px}
 .dtab{padding:0 11px}
 .find.open .msearch{position:absolute;left:0;right:0;top:calc(100% + 8px);width:auto;height:48px;z-index:35;background:var(--pop);border:1px solid var(--bs);box-shadow:0 10px 28px rgba(0,0,0,.35)}
 .find.open .msearch input{color:var(--t)}
 .main{padding:10px max(10px,env(safe-area-inset-right)) 10px max(10px,env(safe-area-inset-left))}
}
.pill{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--bs);background:var(--as);color:var(--ast);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;max-width:46vw}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{flex:1}
.ib{width:40px;height:40px;border-radius:999px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--t)}
.ib:hover{background:var(--as)}
.rel{position:relative}
.main{width:100%;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));flex:1}
.tool{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;height:48px;border:1px solid var(--bs);background:var(--s);border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 14px}
.search:focus-within{border-color:var(--a)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:16px}
.search .n{font-size:12px;color:var(--m);white-space:nowrap}
.btn{height:48px;min-width:48px;padding:0 14px;border-radius:12px;border:1px solid var(--bs);background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;text-decoration:none}
.btn:hover{background:var(--as)}
.btn.pri{background:var(--a);color:var(--ac);border-color:var(--a);font-weight:700}
.btn.pri:hover{background:var(--ah)}
.btn.dng{border-color:var(--d);color:var(--d)}
.btn.sm{height:36px;min-width:36px;padding:0 12px;font-size:13px;border-radius:8px}
.badge{min-width:18px;height:18px;border-radius:999px;background:var(--a);color:var(--ac);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.h2{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--m);margin:18px 4px 8px}
.card{background:var(--s);border:1px solid var(--b);border-radius:12px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.vcard{padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;width:100%}
.vcard:hover,.vcard.sel{border-color:var(--bs);background:var(--s2)}
.vcard.sel{border-color:var(--a)}
.vhead{display:flex;gap:12px;align-items:center;min-width:0}
.logo{position:relative;overflow:hidden;width:44px;height:44px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;flex:none}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.logo.lg{width:64px;height:64px;font-size:22px;border-radius:14px}
.logo.sm{width:36px;height:36px;font-size:13px}
.vname{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.vweb{font-size:13px;color:var(--m);overflow-wrap:anywhere}
.vmeta{font-size:13px;color:var(--m);margin-top:auto;padding-top:2px}
.sm-row{display:flex;gap:8px;align-items:baseline;font-size:14px;flex-wrap:wrap}
.sm-row .ti{color:var(--m);font-size:13px}
.srv{font-size:12px;color:var(--ast);background:var(--as);border-radius:999px;padding:2px 8px;white-space:nowrap}
.srv.un{color:var(--w);background:var(--unbg)}
.more{font-size:13px;color:var(--ast)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 10px;border-radius:999px;background:var(--as);color:var(--ast);border:1px solid transparent}
.chip.hit{border-color:var(--a)}
.chip button{border:0;background:transparent;color:var(--m);padding:0 2px;font-size:15px;line-height:1;min-width:20px;min-height:20px}
.chip.tog{cursor:pointer;background:transparent;border-color:var(--bs);color:var(--t);min-height:36px;padding:5px 12px}
.chip.tog.on{background:var(--as);border-color:var(--a);color:var(--ast)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--b);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;min-height:56px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--s2)}
.row.sel{background:var(--s2);box-shadow:inset 3px 0 0 var(--a)}
.row .sub{font-size:12px;color:var(--m)}
.empty{padding:36px 16px;text-align:center;color:var(--m)}
.scroll{overflow:hidden}
.ov{position:fixed;inset:0;z-index:40;background:rgba(3,6,14,.64)}
.pop{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--pop);border-top:1px solid var(--bs);border-radius:16px 16px 0 0;padding:16px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;max-height:88vh;overflow:auto}
.pop h3{margin:0 4px 4px;font-size:14px}
.pop .mh{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--m);padding:10px 10px 4px}
.opt{display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 14px;border-radius:12px;border:1px solid var(--bs);background:var(--s2);width:100%;text-align:left;text-decoration:none}
.opt:hover{border-color:var(--a)}
.opt .ic{width:40px;height:40px;border-radius:999px;background:var(--as);color:var(--ast);display:inline-flex;align-items:center;justify-content:center}
.opt b{display:block;font-size:15px}.opt span.s{display:block;font-size:12px;color:var(--m)}
.fld{display:flex;flex-direction:column;gap:6px;padding:10px 14px;border-radius:12px;border:1px solid var(--bs);background:var(--s2)}
.lab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--m)}
.in,select.in{height:40px;width:100%;border-radius:8px;border:1px solid var(--bs);background:var(--as);padding:0 10px;font-size:16px;outline:0}
.in:focus{border-color:var(--a)}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;font-size:15px}
.chk input{width:18px;height:18px;accent-color:var(--a);margin:0}
@media(min-width:640px){
 .ov{background:transparent}
 .pop{position:absolute;left:0;right:auto;bottom:auto;top:calc(100% + 8px);width:320px;border:1px solid var(--bs);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.5);padding:14px 12px 12px}
 .pop.r{left:auto;right:0}
 .pop.menu{width:250px;padding:6px;gap:2px;border-radius:12px}
 .pop.menu h3,.pop.menu>.btn{display:none}
 .pop.menu .opt{border:0;background:transparent;min-height:50px;padding:6px 10px;gap:12px;border-radius:8px}
 .pop.menu .opt:hover{background:var(--as)}
 .pop.menu .opt .ic{width:34px;height:34px}
 .pop.menu .opt b{font-size:14px}
 .pop.menu .mh{display:block}
 .main{padding:16px 20px}
}
.appsgrid{display:grid;grid-template-columns:repeat(var(--cols,3),88px);gap:8px}
.tile{width:88px;padding:12px 6px 10px;border-radius:12px;background:transparent;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600;border:0;text-align:center}
.tile:hover{background:var(--as)}
.tile.cur{background:var(--s2)}
.tile svg{width:40px;height:40px;display:block}
.desk{display:block}
@media(min-width:768px){
 .desk{display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,32vw,430px);gap:16px;align-items:start}
 .desk.nodet{grid-template-columns:minmax(0,1fr)}
}
/* the vendor panel stays put beside the grid, and scrolls on its own when it's taller than the window */
@media(min-width:768px){.desk.tw{grid-template-columns:minmax(0,1fr) clamp(320px,36vw,480px)}.desk.tw.nodet{grid-template-columns:minmax(0,1fr)}}
.detail{position:sticky;top:16px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain;border-radius:12px;scrollbar-width:thin;scrollbar-color:var(--bs) transparent}
.dhead{padding:16px;display:flex;gap:14px;align-items:center}
.pen{opacity:0;transition:opacity .15s}
.dhead:hover .pen,.crow:hover .pen,.ccard:hover .pen,.pen:focus-visible{opacity:1}
@media(hover:none){.pen{opacity:1}}
.sec{padding:14px 16px;border-top:1px solid var(--b)}
.crow{padding:12px 16px;border-top:1px solid var(--b);display:flex;gap:12px}
.crow .nm{font-weight:700}
/* a vendor's contacts: one card each */
.clist{display:flex;flex-direction:column;gap:10px;padding:0 12px 12px}
.ccard{border:1px solid var(--b);border-radius:12px;background:var(--s2);padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:10px}
.ccard-h{display:flex;align-items:center;gap:12px;min-width:0}
.ccard-h .cf-av{width:40px;height:40px;font-size:14px}
.ccard-h .nm{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.ccard-h .nmpen{width:28px;height:28px;vertical-align:middle;margin-left:2px;color:var(--m)}
.ccard-h .nmpen:hover{color:var(--t)}
.ccard-h .nmpen svg{width:15px;height:15px}
.ccard-acts{display:flex;align-items:center;margin-left:auto;flex:none}
.ccard-acts .ib{width:36px;height:36px;color:var(--m)}
.ccard-acts .ib:hover{color:var(--t)}
.ccard-b{display:flex;flex-direction:column;gap:2px;padding-left:52px}
@media(max-width:639px){.ccard-b{padding-left:0}.ccard-acts .ib{width:44px;height:44px}}
.kv{font-size:14px;color:var(--ast);text-decoration:none;display:inline-flex;gap:6px;align-items:center;min-height:28px;overflow-wrap:anywhere}
.linkish{border:0;background:none;padding:0;color:var(--ast);font:inherit;cursor:pointer}
.linkish:hover{text-decoration:underline}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;font-size:14px;font-weight:600;color:var(--ast);padding:8px 4px;min-height:44px}
.page{max-width:720px;margin:0 auto}
.warn{padding:10px 14px;border-radius:12px;border:1px solid var(--w);background:var(--warnbg);color:var(--warnt);font-size:14px}
.okb{padding:10px 14px;border-radius:12px;border:1px solid var(--okbd);background:var(--okbg);color:var(--okt);font-size:14px}
.errb{padding:10px 14px;border-radius:12px;border:1px solid var(--errbd);background:var(--errbg);color:var(--errt);font-size:14px}
.cardimg{height:190px;border-radius:12px;border:1px dashed var(--bs);background:var(--s);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--m);overflow:hidden;position:relative}
.cardimg img{width:100%;height:100%;object-fit:contain}
.cardimg .busy{position:absolute;inset:0;background:rgba(13,17,32,.72);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--t)}
.sw{position:relative;width:46px;height:28px;border-radius:999px;background:var(--bs);border:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--a)}.sw.on::after{left:21px}
.bar{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px}
.bar .btn{flex:1}
/* a dialog's Delete / Cancel / Save as icons: Delete on the left, the other two on the right */
.bar.icons{justify-content:flex-end}
.bar.icons .btn{flex:0 0 auto;width:48px;padding:0}
.bar.icons .btn.dng{margin-right:auto}
.modal-ov{position:fixed;inset:0;z-index:50;background:rgba(3,6,14,.64);display:flex;align-items:flex-end;justify-content:center}
.dlg{background:var(--s);border:1px solid var(--bs);width:100%;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.dlg .bar{background:var(--s);bottom:-8px}
.dlg .page{max-width:none}
@media(min-width:640px){.modal-ov{align-items:center}.dlg{width:min(620px,calc(100vw - 32px));border-radius:16px;max-height:88vh;padding:20px}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#e6e9f1;color:#12162b;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--bs);border-top-color:var(--a);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{font-size:12px;color:var(--m)}
.tabs{display:flex;gap:4px;margin:2px 0 0;flex-wrap:wrap}
.offline{background:var(--warnbg);color:var(--warnt);border-bottom:1px solid var(--w);text-align:center;font-size:14px;padding:8px 12px}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--m);padding:36px 16px}
/* cropping a card photo: the frame's four corners drag; outside it is dimmed */
.crop{position:relative;margin:0 auto;max-width:100%;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;border-radius:12px;background:#000}
.crop img{display:block;width:100%;height:100%;pointer-events:none}
.cr{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(3,6,14,.6);cursor:move;touch-action:none}
.hd{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;touch-action:none}
.hd::after{content:"";position:absolute;left:13px;top:13px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.hd.tl{left:0;top:0;cursor:nwse-resize}.hd.tr{left:100%;top:0;cursor:nesw-resize}.hd.bl{left:0;top:100%;cursor:nesw-resize}.hd.br{left:100%;top:100%;cursor:nwse-resize}
.cardview{display:block;max-width:100%;max-height:68vh;margin:0 auto;border-radius:10px}
/* the contact form: plain labels over clean inputs, icons inside, sections split by a rule */
.cf{display:flex;flex-direction:column;gap:16px}
.cf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.cf-f{display:flex;flex-direction:column;gap:6px;min-width:0}
.cf-f>label,.cf-lt{font-size:13px;font-weight:600;color:var(--m)}
.cf-in{position:relative;display:flex;align-items:center;gap:8px}
.cf-in>svg{position:absolute;left:12px;color:var(--m);pointer-events:none}
.in2{height:44px;width:100%;min-width:0;border-radius:10px;border:1px solid var(--b);background:var(--bg);padding:0 12px;font-size:16px;outline:0;transition:border-color .15s,box-shadow .15s}
.cf-in>svg+.in2{padding-left:38px}
.in2:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(147,163,214,.22)}

/* ---------- talking to the server ---------- */
function api(path,opts){
 opts=opts||{};
 var o={method:opts.method||'GET',headers:{}};
 if(opts.body instanceof FormData)o.body=opts.body;
 else if(opts.body!==undefined){o.body=JSON.stringify(opts.body);o.headers['Content-Type']='application/json'}
 return fetch(path,o).then(function(r){
  if(S.offline){S.offline=false;render()}
  return r.json().catch(function(){return {}}).then(function(d){if(!r.ok)throw new Error(d.error||('the server answered '+r.status));return d});
 },function(e){S.offline=true;render();throw new Error("You're offline")});
}
function qs(o){return Object.keys(o).filter(function(k){return o[k]!==''&&o[k]!=null&&o[k]!==false}).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(o[k])}).join('&')}
var listSeq=0,listTimer=null;
function loadList(delay){
 clearTimeout(listTimer);
 listTimer=setTimeout(function(){
  var seq=++listSeq;
  if(!S.div)return;
  // both lists, so every tab shows its count (the one showing is waited on; the other fills its count in)
  var q={division:S.div,q:S.q.trim(),state:S.st==='Any'?'':S.st,with_contact:S.wc?1:''},items=S.mode==='items';
  var done=function(main){return function(){if(seq!==listSeq)return;if(main){S.loading=false;S.err=''}paintResults()}};
  var bad=function(main){return function(e){if(seq!==listSeq||!main)return;S.loading=false;S.err=e.message;paintResults()}};
  api('/api/vendors/items?'+qs(q)).then(function(d){if(seq===listSeq)S.items=d.items||[]}).then(done(items),bad(items));
  api('/api/vendors?'+qs(q)).then(function(d){
   if(seq===listSeq)S.results=(d.vendors||[]).map(function(v){v.item_names=v.item_names||[];v.matched_items=v.matched_items||[];v.states=v.states||[];return v});
  }).then(done(!items),bad(!items));
 },delay||0);
}

function hash(s){var h=0;s=String(s);for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}

function srvLine(c){return '<span class="srv'+(c.unset?' un':'')+'">'+esc(c.area_text)+'</span>'}
function toks(){return S.q.toLowerCase().split(/\s+/).filter(Boolean)}
function hl(txt,T){var out=esc(txt);T.forEach(function(t){if(!t)return;var re=new RegExp('('+esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');out=out.replace(/(<[^>]*>)|([^<]+)/g,function(m,tag,text){return tag?tag:text.replace(re,'<mark>$1</mark>')})});return out}

function shortDate(iso){if(!iso)return '';var d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}
// A phone number as "(801) 555-0173 ext. 12": the extension kept apart in the form, and dialed after a pause.
function splitPhone(p){var m=/^(.*?)\s*(?:ext\.?|extension|x|#)\s*(\d+)\s*$/i.exec(String(p||''));return m?{phone:m[1],ext:m[2]}:{phone:String(p||''),ext:''}}
// Capitals as you type: each word's first letter goes up, nothing typed in capitals comes down
// ("McGrath", "LLC" stay). Titles and vendor names, when you leave the box, also take small words
// back down: "Vice President Of Sales" -> "Vice President of Sales".
function capWords(s){return String(s||'').replace(/(^|[\s\-\/(&])([a-z])/g,function(m,a,b){return a+b.toUpperCase()})}
function titleCase(s){return capWords(s).replace(/(\s)(Of|And|The|For|In|At|To|A|An|Or|On|By|With|De)(?=\s)/g,function(m,sp,w){return sp+w.toLowerCase()})}
// A name read off a card in ALL CAPS: "RHETT MACKAY" -> "Rhett Mackay".
function unshout(s){s=String(s||'');return /[a-z]/.test(s)?s:capWords(s.toLowerCase())}
// People's names also get McGrath and O'Neil right.
function nameCase(s){return capWords(s).replace(/\b(Mc|O')([a-z])/g,function(m,a,b){return a+b.toUpperCase()})}
var CAP_FIELDS={name:nameCase,title:titleCase,vendor:titleCase};
// name@company.com: one @, no spaces, a dot in the part after it. Empty is fine (email is optional).
function emailBad(e){e=String(e||'').trim();return !!e&&!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(e)}
function joinPhone(d){return (d.phone||'').trim()+(String(d.ext||'').trim()?' ext. '+String(d.ext).trim():'')}
function telHref(p){var s=splitPhone(p);return 'tel:'+s.phone.replace(/[^\d+]/g,'')+(s.ext?','+s.ext:'')}
// "8015550173" -> "(801) 555-0173" as it's typed; a number starting with + is left alone.
function fmtPhone(v){
 v=String(v||'');if(/^\s*\+(?!1)/.test(v))return v;
 var d=v.replace(/\D/g,'');if(d.length===11&&d[0]==='1')d=d.slice(1);d=d.slice(0,10);
 if(d.length<=3)return d;
 if(d.length<=6)return '('+d.slice(0,3)+') '+d.slice(3);
 return '('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6);
}

function renderScan(){

 if(S.scanStage===1)h+='<div class="busy"><div class="spin"></div><span>'+esc(S.scanMsg||'Reading card…')+'</span></div>';

 h+='<button class="btn" data-act="skipscan">Enter it by hand instead</button>';

// A photo shrunk to at most 1600px on its long side, as JPEG: what's read and what's kept.
function shrink(file){
 return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
   var k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
   c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
   c.toBlob(function(b){b?res({blob:b,dataUrl:c.toDataURL('image/jpeg',.85)}):rej(new Error('couldn’t read that photo'))},'image/jpeg',.85);
  };
  img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('that isn’t a photo this browser can open'))};
  img.src=url;
 });
}
var tessLoad=null;
function tesseract(){
 if(window.Tesseract)return Promise.resolve(window.Tesseract);
 if(!tessLoad)tessLoad=new Promise(function(res,rej){var s=document.createElement('script');s.src=TESSERACT_URL;s.onload=function(){res(window.Tesseract)};s.onerror=function(){tessLoad=null;rej(new Error('couldn’t load the card reader'))};document.head.appendChild(s)});
 return tessLoad;
}
// The card reader. CARD_READER (from the server's VENDORS_CARD_READER) picks it; "browser" reads the card
// here with Tesseract.js. Another reader (Azure, an AI model) only has to give back the same fields.
var READERS={
 browser:function(blob){
  return tesseract().then(function(T){
   return T.recognize(blob,'eng',{logger:function(m){if(m.status==='recognizing text'){S.scanMsg='Reading card… '+Math.round(100*m.progress)+'%';paintScanMsg()}else if(/load/.test(m.status||'')){S.scanMsg='Getting the card reader ready…';paintScanMsg()}}});
  }).then(function(r){return parseCard(r.data.text||'')});
 }
};
function paintScanMsg(){var b=document.querySelector('.cardimg .busy span');if(b)b.textContent=S.scanMsg}
var TITLE_RE=/\b(sales|manager|rep|representative|director|president|owner|estimator|account|territory|engineer|dispatch|specialist|coordinator|consultant|vp|vice|ceo|cfo|coo|principal|partner|branch|regional|inside|outside|operations|marketing|purchasing|project|supervisor|technician|agent|associate)\b/i;
var CO_RE=/\b(inc|llc|l\.l\.c|co|corp|corporation|company|supply|supplies|materials|products|industries|group|enterprises|distribution|distributors|systems|solutions|services|equipment|rental|rentals|precast|steel|pipe|concrete|aggregate|ltd)\b\.?/i;
function parseCard(text){
 var lines=text.split(/\n+/).map(function(l){return l.replace(/[|_~]+/g,' ').replace(/\s+/g,' ').trim()}).filter(function(l){return l.length>1});
 var all=lines.join('\n');
 var email=(all.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i)||[''])[0].toLowerCase();
 var web=(all.replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig,' ').match(/\b(?:https?:\/\/)?(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|net|org|us|co|biz|info|io)\b(?:\/\S*)?/i)||[''])[0].replace(/^https?:\/\//i,'').replace(/^www\./i,'');
 var phones=[];
 // each number's label is the few characters just before it ("C: ", "Fax ", "Office")
 lines.forEach(function(l){var re=/(\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}/g,m;while((m=re.exec(l))){var dd=m[0].replace(/\D/g,'').replace(/^1(?=\d{10}$)/,''),lab=l.slice(Math.max(0,m.index-8),m.index);if(dd.length===10)phones.push({n:'('+dd.slice(0,3)+') '+dd.slice(3,6)+'-'+dd.slice(6),fax:/fax|\bf\b/i.test(lab),cell:/\b(c|m|cell|mobile)\b/i.test(lab)})}});
 var ph=phones.filter(function(p){return p.cell})[0]||phones.filter(function(p){return !p.fax})[0]||phones[0];
 var plain=lines.filter(function(l){return !/@|\d{3}.*\d{4}|www\.|\.com\b/i.test(l)});
 var title=plain.filter(function(l){return TITLE_RE.test(l)&&l.split(' ').length<=7})[0]||'';
 // the vendor: one already in Vendors named on the card or sharing its email/web domain, else a company-looking line
 var dom=(email.split('@')[1]||web.split('/')[0]||'').toLowerCase().replace(/^www\./,'');
 var low=all.toLowerCase();
 var known=S.names.filter(function(v){var vd=String(v.website||'').toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0];return (dom&&vd&&vd===dom)||low.indexOf(v.name.toLowerCase())>=0})[0];
 var company=known?known.name:(plain.filter(function(l){return CO_RE.test(l)&&l!==title})[0]||'');
 if(!company&&dom){var b=dom.split('.')[0];company=b.charAt(0).toUpperCase()+b.slice(1)}
 if(company&&company===company.toUpperCase())company=company.toLowerCase().replace(/\b[a-z]/g,function(c){return c.toUpperCase()}).replace(/\b(Llc|Inc)\b/g,function(x){return x==='Llc'?'LLC':x});
 var name=plain.filter(function(l){return l!==title&&l!==company&&!CO_RE.test(l)&&/^[A-Z][a-zA-Z'.-]+(\s+[A-Z][a-zA-Z'.-]*){1,3}$/.test(l)})[0]||'';

}
// The photo is cropped to the card by itself (detectCard), then read. A crop that missed can be
// fixed afterwards from the card's pop-up.
function readCard(file){
 S.scanErr='';S.cardPath=null;S.scanStage=1;S.scanMsg='Finding the card…';render();

  S.crop={img:img,w:img.naturalWidth,h:img.naturalHeight,r:detectCard(img),mode:'auto'};
  return cropped(false);

}
// After the crop: the card is read, and its photo uploaded to keep with the contact.
function readCropped(sh){
 S.scanErr='';S.scanStage=1;S.scanMsg='Reading card…';S.cardPath=null;S.crop=null;render();

  S.scan=sh.dataUrl;render();
  var fd=new FormData();fd.append('file',sh.blob,'card.jpg');
  var up=api('/api/vendors/cards',{method:'POST',body:fd}).then(function(d){S.cardPath=d.path}).catch(function(){S.cardPath=null});
  var reader=READERS[CFG.CARD_READER]||READERS.browser;
  return reader(sh.blob).then(function(f){
   var d=blank(S.ctxV);
   ['name','title','phone','email','website'].forEach(function(k){if(f[k])d[k]=f[k]});
   d.name=nameCase(unshout(d.name));d.title=titleCase(unshout(d.title));

/* ---------- cropping a card photo ---------- */
function loadImg(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i)};i.onerror=function(){rej(new Error('couldn’t open the photo'))};i.src=src})}
// A first guess at where the card is: shrink the photo, take the colour around its edge as the
// background, and keep the rows and columns where enough pixels differ from it. Keeps the whole
// photo when nothing stands out (a card filling the photo, or a busy background).
function detectCard(img){
 var W=img.naturalWidth,H=img.naturalHeight,k=Math.min(1,220/Math.max(W,H)),w=Math.max(1,Math.round(W*k)),h=Math.max(1,Math.round(H*k));
 var fallback={x:0,y:0,w:W,h:H};
 try{
  var c=document.createElement('canvas');c.width=w;c.height=h;var g=c.getContext('2d');g.drawImage(img,0,0,w,h);
  var d=g.getImageData(0,0,w,h).data,b=Math.max(2,Math.round(Math.min(w,h)*.04)),sum=[0,0,0],n=0;
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){if(x>=b&&x<w-b&&y>=b&&y<h-b)continue;var i=(y*w+x)*4;sum[0]+=d[i];sum[1]+=d[i+1];sum[2]+=d[i+2];n++}
  var bg=sum.map(function(s){return s/n}),rows=new Array(h).fill(0),cols=new Array(w).fill(0);
  for(y=0;y<h;y++)for(x=0;x<w;x++){i=(y*w+x)*4;if(Math.abs(d[i]-bg[0])+Math.abs(d[i+1]-bg[1])+Math.abs(d[i+2]-bg[2])>90){rows[y]++;cols[x]++}}
  var y0=rows.findIndex(function(v){return v>w*.15}),y1=h-1-rows.slice().reverse().findIndex(function(v){return v>w*.15});
  var x0=cols.findIndex(function(v){return v>h*.15}),x1=w-1-cols.slice().reverse().findIndex(function(v){return v>h*.15});
  if(y0<0||x0<0||y1-y0<h*.2||x1-x0<w*.2||(x1-x0>w*.97&&y1-y0>h*.97))return fallback;
  var m=Math.round(Math.min(w,h)*.01);x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(w-1,x1+m);y1=Math.min(h-1,y1+m);
  return {x:x0/k,y:y0/k,w:(x1-x0+1)/k,h:(y1-y0+1)/k};
 }catch(e){return fallback}
}
function startCrop(src,mode,cid){
 return loadImg(src).then(function(img){
  S.crop={src:src,img:img,w:img.naturalWidth,h:img.naturalHeight,r:detectCard(img),mode:mode,cid:cid};render();
 });
}
function cropHTML(){
 var C=S.crop,r=C.r,pc=function(v,t){return (100*v/t).toFixed(3)+'%'};

  '<div class="cr" id="cropr" data-h="move" style="left:'+pc(r.x,C.w)+';top:'+pc(r.y,C.h)+';width:'+pc(r.w,C.w)+';height:'+pc(r.h,C.h)+'">'+
  ['tl','tr','bl','br'].map(function(k){return '<span class="hd '+k+'" data-h="'+k+'"></span>'}).join('')+'</div></div>';
}
var drag=null;
document.addEventListener('pointerdown',function(e){
 var hd=e.target.closest&&e.target.closest('[data-h]');if(!hd||!S.crop)return;
 e.preventDefault();var box=$('cropbox').getBoundingClientRect();

 try{hd.setPointerCapture(e.pointerId)}catch(x){}
});
document.addEventListener('pointermove',function(e){
 if(!drag||!S.crop)return;
 var C=S.crop,o=drag.r,dx=(e.clientX-drag.x)*drag.k,dy=(e.clientY-drag.y)*drag.k,min=Math.min(C.w,C.h)*.08;

 editvendor:function(){var v=S.detail;S.vm={name:v.name,website:v.website,confirm:false};S.showDel=false;S.saveSt='';S.saveBad=false},
 dlgtitle:function(){var n=Date.now();taps=taps.filter(function(x){return n-x<800});taps.push(n);if(taps.length>=3){taps=[];S.showDel=true}else return 'skip'},
 vpull:function(){S.busy='pull';api('/api/vendors/'+encodeURIComponent(S.vid)+'/logo',{method:'POST',body:{pull:true}}).then(function(d){S.busy=false;toast(d.ok?'Logo pulled from their site':(d.message||'No logo found'));loadDetail();loadList()}).catch(fail)},
 vlogoclear:function(){api('/api/vendors/'+encodeURIComponent(S.vid)+'/logo',{method:'DELETE'}).then(function(){toast('Logo removed');loadDetail();loadList()}).catch(fail)},
 vdelask:function(){S.vm.confirm=true},vdelno:function(){S.vm.confirm=false},
 vdel:function(){var nm=S.detail.name;S.busy=true;api('/api/vendors/'+encodeURIComponent(S.vid),{method:'DELETE'}).then(function(){S.busy=false;S.vm=null;S.vid=null;S.detail=null;S.view='list';saveUrl();window.scrollTo(0,0);refresh();toast(nm+' deleted')}).catch(fail)},
 scan:function(){S.drawer=false;closeForm();S.panel=null;S.ctxV=S._ctx||'';S._ctx='';go('scan');S.draft=blank(S.ctxV);tesseract().catch(function(){})},
 skipscan:function(){var v=S.ctxV;closeForm();S.ctxV=v;S.draft=blank(v);S.view=S.vid&&!mq.matches?'vendor':'list';S.modal=true},
 manual:function(){S.drawer=false;closeForm();S.ctxV=S._ctx||'';S._ctx='';S.draft=blank(S.ctxV);S.panel=null;S.modal=true},
 addfor:function(){S._ctx=S.detail.name;S.panel=S.panel==='addv'?null:'addv'},
 editc:function(el){var c=S.detail.contacts.filter(function(x){return x.id===el.dataset.id})[0];if(!c)return;closeForm();S.edit=c.id;S.draft=draftFrom(c);S.panel=null;S.modal=true},
 cancel:function(){
  if(S.vm){afterEdits();S.vm=null;return}
  if(S.modal&&S.edit)afterEdits();
  var wasScan=S.view==='scan';closeForm();
  if(wasScan||S.view==='form')S.view=S.vid&&!mq.matches?'vendor':'list';
 },
 cardview:function(el){S.cardView={cid:el.dataset.id};S.crop=null},
 cardclose:function(){S.cardView=null;S.crop=null},
 cardcrop:function(){var c=S.detail.contacts.filter(function(x){return x.id===S.cardView.cid})[0];if(c)startCrop(cardUrl(c),'card',c.id).catch(fail);return 'skip'},
 cropcancel:function(){S.crop=null},
 cardcropsave:function(){
  var cid=S.crop.cid;S.busy=true;render();
  cropped(false).then(function(sh){var fd=new FormData();fd.append('file',sh.blob,'card.jpg');return api('/api/vendors/contacts/'+encodeURIComponent(cid)+'/card',{method:'POST',body:fd})})
   .then(function(){S.busy=false;S.crop=null;toast('Card cropped');loadDetail()}).catch(fail);
  return 'skip';
 },
 opendup:function(){
  var m=S.dup;if(!m)return 'skip';
  closeForm();S.view=mq.matches?'list':'vendor';S.pendingEdit=m.id;openVendor(m.vendor_id);
 },
 star:function(el){
  var cid=el.dataset.id,vid=el.dataset.v,on=false;
  var mark=function(list){(list||[]).forEach(function(c){if(c.id===cid)on=on||!!c.primary})};
  (S.results||[]).forEach(function(v){if(v.id===vid)mark(v.contacts)});if(S.detail&&S.detail.id===vid)mark(S.detail.contacts);
  var to=on?null:cid,set=function(list){(list||[]).forEach(function(c){c.primary=c.id===to})};
  (S.results||[]).forEach(function(v){if(v.id===vid){set(v.contacts);v.primary_contact_id=to}});
  if(S.detail&&S.detail.id===vid){set(S.detail.contacts);S.detail.primary_contact_id=to;S.detail.contacts.sort(function(a,b){return (b.primary?1:0)-(a.primary?1:0)})}
  (S.items||[]).forEach(function(it){it.vendors.forEach(function(v){if(v.id===vid)set(v.contacts)})});
  api('/api/vendors/'+encodeURIComponent(vid)+'/main-contact',{method:'POST',body:{contact_id:to}})
   .then(function(){toast(to?'Main contact set':'Main contact cleared')}).catch(function(e){fail(e);refresh()});
 },
 copyemail:function(el){var e=el.dataset.id;copyText(e).then(function(){toast(e+' copied')},function(){toast('Couldn’t copy it')});return 'skip'},
 sells:function(){S.sellOpen=!S.sellOpen},
 sharec:function(el){var c=(S.detail&&S.detail.contacts||[]).filter(function(x){return x.id===el.dataset.id})[0];if(c)shareContact(c);return 'skip'},
 nat:function(){S.draft.nationwide=!S.draft.nationwide},
 natset:function(el){var on=el.dataset.id==='1';if(S.draft.nationwide===on)return 'skip';S.draft.nationwide=on},
 st:function(el){var s=el.dataset.id,a=S.draft.areas,i=a.map(function(x){return x.state}).indexOf(s);if(i>=0)a.splice(i,1);else{a.push({state:s,regions:[]});a.sort(function(x,y){return STATES.indexOf(x.state)-STATES.indexOf(y.state)})}},
 addreg:function(el){var s=el.dataset.id,inp=document.querySelector('[data-reg="'+s+'"]'),val=inp.value.trim();if(!val)return;var ar=S.draft.areas.filter(function(x){return x.state===s})[0];if(ar.regions.indexOf(val)<0)ar.regions.push(val)},
 rmreg:function(el){var p=el.dataset.id.split('|');S.draft.areas.filter(function(x){return x.state===p[0]})[0].regions.splice(+p[1],1)},
 askdel:function(){S.confirmDel=true},nodel:function(){S.confirmDel=false},
 del:function(){S.busy=true;api('/api/vendors/contacts/'+encodeURIComponent(S.edit),{method:'DELETE'}).then(function(){S.busy=false;closeForm();S.view=mq.matches?'list':(S.vid?'vendor':'list');window.scrollTo(0,0);refresh();toast('Contact deleted')}).catch(fail)}
};
function decide(el,ok){
 el.disabled=true;
 api('/api/vendors/admin/review',{method:'POST',body:{vendor_id:el.dataset.id,division_id:el.dataset.div,approve:ok}}).then(function(){toast(ok?'Approved. Items updated':'Rejected. List left as it was');loadAdmin()}).catch(fail);
}
function syncDraft(){document.querySelectorAll('[data-fld]').forEach(function(i){S.draft[i.dataset.fld]=i.value})}
document.addEventListener('click',function(e){
 var tile=e.target.closest('.tile[data-app]');
 if(tile&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey){
  e.preventDefault();var a=(CFG.APPS||[]).filter(function(x){return x.key===tile.dataset.app})[0];
  S.panel=null;render();if(a&&a.key!=='vendors')openInTab(a.tab,appUrl(a),a.open);return;
 }
 // New contact's menu closes on a click anywhere else (the sidebar is its own layer, so its .ov can't catch them all)
 if(S.panel==='sadd'&&!e.target.closest('.side .rel')){S.panel=null;if(!e.target.closest('[data-act]'))render()}
 var el=e.target.closest('[data-act]');
 if(!el){
  return;
 }
 var act=el.dataset.act;
 if(act==='cancel-ov'){if(e.target!==el)return;act='cancel'}
 if(act==='cardclose-ov'){if(e.target!==el)return;act='cardclose'}
 if(S.draft)syncDraft();
 if(S.armItem&&act!=='rmitem')S.armItem=null;
 if(A[act]){e.preventDefault();if(A[act](el)==='skip')return;render();if(/^(nat|natset|st|addreg|rmreg)$/.test(act))autoSave(0)}
});
document.addEventListener('input',function(e){
 var t=e.target;
 if(t.id==='q'){S.q=t.value;loadList(220)}
 else if(t.dataset&&t.dataset.fld){
  if(t.dataset.fld==='phone'||t.dataset.fld==='alt'){
   var before=t.value.slice(0,t.selectionStart).replace(/\D/g,'').length,nv=fmtPhone(t.value);
   if(nv!==t.value){t.value=nv;var pos=0,seen=0;while(pos<nv.length&&seen<before){if(/\d/.test(nv[pos]))seen++;pos++}try{t.setSelectionRange(pos,pos)}catch(x){}}
  }
  if(CAP_FIELDS[t.dataset.fld]){var cv=(t.dataset.fld==='name'?nameCase:capWords)(t.value);if(cv!==t.value){var cs=t.selectionStart,ce=t.selectionEnd;t.value=cv;try{t.setSelectionRange(cs,ce)}catch(x){}}}
  if((t.dataset.fld==='ext'||t.dataset.fld==='altExt')&&/\D/.test(t.value))t.value=t.value.replace(/\D/g,'').slice(0,6);
  S.draft[t.dataset.fld]=t.value;
  if(/^(name|title|vendor)$/.test(t.dataset.fld))paintHead();
  if(t.dataset.fld==='vendor'){var h=$('vhint');if(h)h.textContent=vendorHint(t.value,vendorMatch(t.value))}
  if(t.dataset.fld==='email'){checkDup();var ee=$('emailerr');if(ee)ee.textContent=emailBad(t.value)&&t.value.indexOf('@')>=0&&/\.\w*$/.test(t.value)?'That email doesn’t look right':''}
  if(t.dataset.fld!=='vendor')autoSave();
 }
 else if(t.id==='newitem')S.newItem=t.value;
 else if(t.dataset&&t.dataset.vf){
  if(t.dataset.vf==='name'){var vc=capWords(t.value);if(vc!==t.value){var vs0=t.selectionStart;t.value=vc;try{t.setSelectionRange(vs0,vs0)}catch(x){}}}
  S.vm[t.dataset.vf]=t.value;autoSave();
 }
});
document.addEventListener('keydown',function(e){
 if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.reg!==undefined){e.preventDefault();var b=document.querySelector('[data-act="addreg"][data-id="'+e.target.dataset.reg+'"]');if(b)b.click()}
 if(e.key==='Escape'){
  if(S.cardView){if(S.crop)S.crop=null;else S.cardView=null;render()}
  else if(S.vm||S.modal){A.cancel();render()}
  else if(S.panel){S.panel=null;render()}
  else if(S.drawer){S.drawer=false;render()}
  else if(S.findOpen&&!S.q){S.findOpen=false;render()}
  else if(S.view==='scan'&&S.scanStage!==1){A.cancel();render()}
 }
});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.dataset&&CAP_FIELDS[t.dataset.fld]&&S.draft){
  var fixed=CAP_FIELDS[t.dataset.fld](t.value.replace(/\s+/g,' ').trim());
  if(fixed!==t.value)t.value=fixed;
  S.draft[t.dataset.fld]=t.value;paintHead();
  if(t.dataset.fld==='vendor'){var vh=$('vhint');if(vh)vh.textContent=vendorHint(t.value,vendorMatch(t.value))}
  if(t.dataset.fld!=='title')checkDup(0);
  autoSave(0);return;
 }
 if(t.dataset&&t.dataset.vf==='name'&&S.vm){t.value=titleCase(t.value.replace(/\s+/g,' ').trim());S.vm.name=t.value;autoSave(0);return}
 if(t.dataset&&t.dataset.fld==='email'&&S.draft){   // leaving the box: tidy it, and say if it's still off
  t.value=t.value.trim().toLowerCase();S.draft.email=t.value;
  var ee=$('emailerr');if(ee)ee.textContent=emailBad(t.value)?'That email doesn’t look right':'';
  autoSave(0);return;
 }
 if(t.dataset.chg==='st'){S.st=t.value;render();loadList()}
 else if(t.dataset.chg==='wc'){S.wc=t.checked;render();loadList()}
 else if(t.hasAttribute('data-vlogo')&&t.files[0]){
  var fd=new FormData();fd.append('file',t.files[0]);t.value='';
  api('/api/vendors/'+encodeURIComponent(S.vid)+'/logo',{method:'POST',body:fd}).then(function(){toast('Logo uploaded');loadDetail();loadList()}).catch(fail);
 }
 else if(t.dataset.web){
  var vid=t.dataset.web;
  api('/api/vendors/'+encodeURIComponent(vid),{method:'PATCH',body:{website:t.value.trim()}}).then(function(){toast('Web address saved')}).catch(fail);
 }
 else if(t.dataset.pdf!==undefined&&t.files[0]){
  var fp=new FormData();fp.append('vendor_id',t.dataset.pdf);fp.append('file',t.files[0]);t.value='';
  toast('Uploading the catalog…');
  api('/api/vendors/admin/pdf',{method:'POST',body:fp}).then(function(d){toast(d.message||'Catalog uploaded. Its items show up in To review');setTimeout(loadAdmin,6000)}).catch(fail);
 }
 else if(t.hasAttribute('data-file')&&t.files[0]){var f=t.files[0];t.value='';readCard(f)}
});
document.addEventListener('submit',function(e){
 e.preventDefault();var f=e.target.dataset.form;
 if(f==='contact'){syncDraft();if(S.edit&&S.modal){autoSave(0)}else saveContact()}
 else if(f==='vmodal')autoSave(0);
 else if(f==='vendor'){
  var nn=titleCase($('nv-n').value.replace(/\s+/g,' ').trim()),ww=$('nv-w').value.trim();if(!nn){toast('Add a vendor name');return}
  api('/api/vendors/admin/vendors',{method:'POST',body:{name:nn,website:ww,division:S.div}}).then(function(){toast(ww?'Vendor added. Pulling its items now':'Vendor added');loadAdmin();loadNames()}).catch(fail);
 }
 else if(f==='item'){
  var n=S.newItem.trim();if(!n||S.busy)return;S.busy=true;
  api('/api/vendors/'+encodeURIComponent(S.vid)+'/items',{method:'POST',body:{division:S.div,name:n}}).then(function(){S.busy=false;S.newItem='';S.addItem=true;loadDetail();loadList()}).catch(fail);
 }
});

/* ---------- tabs and links from the other services ---------- */
var tabRefs={};
function openInTab(name,url,fn){
 var w=tabRefs[name];
 try{if(w&&!w.closed&&typeof w[fn]==='function'&&w[fn](url)){w.focus();return}}catch(e){}
 var nw=window.open(url,name);if(nw){tabRefs[name]=nw;try{nw.focus()}catch(e){}}
}
window.vnOpenLink=function(href){
 var u=new URL(href,location.href);if(u.pathname!==location.pathname||!S.divs.length)return false;
 var d=u.searchParams.get('division'),v=u.searchParams.get('vendor');
 if(d&&d!==S.div&&S.divs.some(function(x){return x.id===d})){S.div=d;S.vid=null;S.detail=null;S.results=null;S.loading=true;loadList()}
 closeForm();S.vm=null;S.view='list';
 if(v)openVendor(v);else saveUrl();
 render();return true;
};

/* ---------- start ---------- */
window.addEventListener('online',function(){S.offline=false;render();refresh()});
window.addEventListener('offline',function(){S.offline=true;render()});
mq.addEventListener&&mq.addEventListener('change',function(){if(S.view==='vendor'&&mq.matches)S.view='list';ensureSelection();render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){});
render();
api('/api/divisions').then(function(divs){
 S.divs=divs.map(function(d){return {id:d.id,name:d.name}});
 var p=new URLSearchParams(location.search),want=p.get('division'),saved='';
 try{saved=localStorage.getItem('vendors.div')||''}catch(e){}
 var has=function(id){return id&&S.divs.some(function(d){return d.id===id})};
 S.div=has(want)?want:has(saved)?saved:(S.divs[0]||{}).id||'';
 S.loading=false;render();
 if(!S.div)return;
 S.loading=true;loadList();loadNames();
 if(p.get('vendor')&&p.get('contact')){S.mode='people';openPerson(p.get('contact'),p.get('vendor'))}
 else if(p.get('vendor'))openVendor(p.get('vendor'));else saveUrl();
 render();
}).catch(function(e){S.loading=false;S.err='Couldn’t load the divisions: '+e.message;render()});
})();
</script>
</body>
